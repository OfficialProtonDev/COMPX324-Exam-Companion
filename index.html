S): members sign the code; breaches investigated; violators sanctioned. ACM 3.1: ensure the public good is the central concern in all professional computing work – research, requirements, design, testing, deployment… disposal.", "ref": "1-2 p7"}, {"text": "Five principles for UX studies involving people: respecting privacy; absence of coercion; providing full information; informed consent; protection from harm.", "ref": "1-2 p9"}, {"text": "Privacy: anonymity, confidentiality, secure data storage/usage. Anonymity is not just removing names. Report via aggregation and anonymising identifying info. Applies to people in your Project too.", "ref": "1-2 p10"}, {"text": "Voluntary participation: free from coercion, undue influence (reward) and duress (threatened penalty). Participants free to withdraw at any time, for any reason, with no adverse consequences.", "ref": "1-2 p12"}, {"text": "Full information + informed consent: tell purpose; no deception unless specific permission (then debrief); procedures and time expectations; risks (psychological, physical, unanticipated); realistic benefits; alternatives. Consent obtained from participant or proxy (e.g. parent) BEFORE starting; participant must be able to decline.", "ref": "1-2 p14"}, {"text": "Reporting: keep disclosed demographic/financial/health data confidential; code participants P1, P2 (no names or initials), keep codes and details separate; keep raw data secure and destroy it when the study is over if promised; no quotes/descriptions that could identify someone. Simplest: don’t collect what you don’t need. Marked in every Project phase.", "ref": "1-2 p15"}, {"text": "Data deletion obligation: the course promised to delete user-related material at the end of the paper – “remember to live up to your ethical obligations”. University HREC must approve human-subject studies in advance; lecturer applies for whole class (1-2 p16). Why care: Milgram/Stanford Prison; good methods = good results; reputation; participants may join future studies (1-2 p17).", "ref": "12-1 p4"}, {"text": "Ethics of the artefact: deceptive design (formerly ‘dark patterns’), addictive design, exclusive design (deliberately excluding groups), just bad design. Frameworks shown: ind.ie Ethical Design pyramid (1-2 p26) (human rights → human effort → human experience); Ethics Centre principles (Ought before can, Non-instrumentalism, Self-determination, Responsibility, Net benefit, Fairness, Accessibility, Purpose) (1-2 p28).", "ref": "1-2 p19"}], "apply": ["Was informed consent obtained BEFORE the study – purpose, time, risks explained, right to decline/withdraw without consequence?", "Could any participant be re-identified from quotes, demographics or context (cf. AOL 4417749)? Use P1/P2 codes and aggregate.", "Is anyone pressured – reward (undue influence), penalty (duress), power relationship (staff/customer, lecturer/student, in a queue)?", "Is data minimal, stored securely, and deleted when promised?", "For the artefact: deceptive? addictive? exclusive? manipulative copy (‘I don’t want my benefits’)? Who owns the data? Is there deception? (12-1 p6 ethical evaluation lens)", "Ask: “Is anyone harmed by the design choices I've made here?”"], "limits": [{"text": "Highly context-dependent: e.g. your desire for functional weapons depends on context (Ukraine). Needs judgement – pause, reflect.", "ref": "1-2 p25"}, {"text": "True anonymity is hard: ‘anonymised’ data can be re-identified (AOL searcher No. 4417749 traced from search queries).", "ref": "1-2 p11"}, {"text": "Tension with data quality: encounters must be non-invasive with no repercussions “without sacrificing the accuracy or usefulness of our results”. E.g. at parties, recording was unacceptable and visible note-taking changes behaviour.", "ref": "1-2 p8"}, {"text": "Business pressure: ‘Redesign the unsubscribe feature to reduce loss of users’ – informative, persuasive or manipulative?", "ref": "1-2 p29"}], "examples": [{"text": "AOL released 20M ‘anonymous’ search queries; NYT identified user No. 4417749 from her search queries (e.g. ‘landscapers in Lilburn, Ga’, people named Arnold).", "ref": "1-2 p11"}, {"text": "Shady unsubscribe copy: Wish ‘I don’t like discounts’, Amazon Prime ‘I don’t want my benefits’ instead of ‘Yes, please unsubscribe me’ (Ethical Design Handbook).", "ref": "1-2 p30"}, {"text": "False statements / lazy design: Twitter blue check claimed accounts ‘subscribed to Twitter Blue and verified their phone number’ when they hadn’t (incl. dead people).", "ref": "1-2 p21"}, {"text": "Addictive design: 2026 LA jury found Meta and YouTube intentionally built addictive social media platforms that harmed a young woman’s mental health.", "ref": "1-2 p23"}, {"text": "Observation reports anonymised: “Later M5 switched the CD” – reader cannot identify anyone.", "ref": "2-1 p15"}], "quotes": [{"text": "Ethical UX design should never exploit human psychology in order to encourage people to perform actions that are against their best interests.", "ref": "1-2 p32"}, {"text": "Is anyone harmed by the design choices I've made here?", "ref": "1-2 p33"}, {"text": "A broken gun is better designed than a working gun.", "ref": "1-2 p24"}], "related": ["ux-process", "interviews", "observations", "diary-studies", "questionnaires", "accessibility", "user-diversity", "ai-iui"], "keySlides": ["1-2 p9", "1-2 p28", "1-2 p26"]}, {"id": "human-capabilities", "name": "Human Capabilities (Human & Computer I/O)", "group": "awareness", "lecture": "3-2", "aliases": ["human capabilities", "human I/O", "humans and computers", "humans v computers", "perception", "vision", "eyesight", "colour", "color", "colour blindness", "color blindness", "colour blind", "hearing", "audio", "touch", "haptics", "reaction time", "movement", "memory", "short-term memory", "reading", "readability", "ambiguous characters", "input devices", "keyboard", "QWERTY", "Dvorak", "speech recognition", "touchscreen"], "summary": "Humans as information I/O systems – vision, hearing, touch, movement, memory and processing – each limited and varying between people (age, sex, disability) and contexts (noise, glare, stress). Designs and I/O devices must fit these capabilities.", "points": [{"text": "Humans: information i/o (visual, auditory, haptic, movement); memory (sensory, short-term, long-term); processing (reasoning, problem solving, skill, error). Each person different – age, sex, height, vision, disability.", "ref": "3-2 p3"}, {"text": "Diversity of use: contextual factors (ambient noise, sunlight, reflections); attention is a resource, multi-tasking; emotion influences capabilities; cognition under stress is much less effective.", "ref": "3-2 p4"}, {"text": "Vision = physical reception + processing/interpretation (3-2 p5). Retina: rods (low light), cones (colour) (3-2 p6). Visual system compensates for movement/brightness, uses context to resolve ambiguity; overcompensation → illusions (Ponzo, Müller-Lyer); we perceive what we expect (the dress, 3-2 p21); change detection failure (basketball video, 3-2 p24).", "ref": "3-2 p19"}, {"text": "Brightness: subjective, measured by ‘just noticeable difference’; acuity rises with luminance, as does flicker. Colour: hue, intensity, saturation; blue acuity lowest; 8% of males, 1% of females colour blind, red-green most common; language/culture affect colour labels (Japanese ao).", "ref": "3-2 p12"}, {"text": "Reading: saccades and fixations (perception during fixations); word shape matters; negative contrast (dark on light) better on screen. (3-2 p30) Lowercase easier for words; UPPERCASE better for letters/non-words (BA793); serif more distinguishable, sans serif often better on screen; ambiguous characters 1IlO0B85S2Z (3-2 p31).", "ref": "3-2 p29"}, {"text": "Hearing: pitch (frequency), loudness (amplitude), timbre. Range 20 Hz to 15–20 kHz, worse at high frequencies, declines with age (3-2 p35); cocktail party effect – filter one stimulus out of noise.", "ref": "3-2 p34"}, {"text": "Touch: thermoreceptors, nociceptors (pain), mechanoreceptors (pressure); fingers more sensitive; kinesthesis = awareness of body position. Haptic output (3-2 p40): vibration, force feedback, electro-stimulation, tactile pins, thermal.", "ref": "3-2 p37"}, {"text": "Movement: response time = reaction time + movement time. Reaction: visual ~200 ms, auditory ~150 ms, pain ~700 ms. Movement time depends on age, fitness. Increasing reaction time decreases accuracy in unskilled but not skilled operators.", "ref": "3-2 p42"}, {"text": "Humans v computers (Shneiderman): humans better at sense-making, detecting familiar signals in noise, adapting, unanticipated situations, value judgements, new solutions, asking others for help. Computers better at stimuli outside human range, rapid consistent responses, accurate retrieval, repetitive actions, multiple activities at once, sustained performance.", "ref": "3-2 p67"}], "apply": ["Does the design rely on colour alone? Check in a colour-blindness simulator; add shape/label redundancy.", "Is text readable: dark on light, mixed case for words, unambiguous characters in codes (no 1/l/I, O/0)?", "Does it work in context – noise, sunlight/glare, stress, one hand busy, divided attention?", "Are audio cues audible to older users, and backed by visual/haptic redundancy?", "Does it reduce memory load (recognition rather than recall)?", "Is work split sensibly: humans for judgement/adaptation, computer for repetition and accurate recall?"], "limits": [{"text": "No ‘average user’: capabilities vary by age, sex, vision, disability.", "ref": "3-2 p3"}, {"text": "Lab-measured capability overstates real use: stress, emotion, multi-tasking and context degrade performance.", "ref": "3-2 p4"}, {"text": "Better input designs don’t win automatically: Dvorak 10–15% faster/less fatigue (disputed) but QWERTY’s large social base resists change; chorded keyboards face social resistance + fatigue.", "ref": "3-2 p47"}, {"text": "Speech recognition works best with a single trained user and limited vocabulary; problems with noise, imprecise pronunciation, large vocabularies, different speakers/accents.", "ref": "3-2 p59"}], "examples": [{"text": "BBC election graphics: colour-blind viewers couldn’t tell Conservative blue from UKIP purple, Labour red from Lib Dem orange.", "ref": "3-2 p15"}, {"text": "Teen text-message ringtone (~17 kHz) most adults can’t hear – audible range shrinks with age.", "ref": "3-2 p35"}, {"text": "Touchscreen: fast, no pointer, good for menus, robust in hostile environments; but fingers mark screen, imprecise (blunt instrument), poor for small targets/drawing.", "ref": "3-2 p45"}, {"text": "Speech input 2.93× faster than keyboard for English, 2.87× for Mandarin Pinyin (Ruan et al. 2018).", "ref": "3-2 p58"}, {"text": "Alexa ordered unwanted merchandise – “the device isn’t aware it’s a child versus a parent”.", "ref": "3-2 p60"}], "quotes": [{"text": "Cognition under stress is much less effective", "ref": "3-2 p4"}, {"text": "Frequently, we will simply see or perceive what we expect to perceive—or even what we want to perceive", "ref": "3-2 p21"}], "related": ["accessibility", "redundancy", "fitts", "voice", "recency", "error-types", "user-diversity", "tangible", "ambient"], "keySlides": ["3-2 p67", "3-2 p12", "3-2 p35"]}, {"id": "ai-iui", "name": "Intelligent User Interfaces (AI & UX)", "group": "awareness", "lecture": "7-1", "aliases": ["IUI", "intelligent user interface", "AI", "artificial intelligence", "adaptive interface", "recommender", "recommender system", "agent", "agentic", "chatbot", "conversational interface", "Clippy", "personalisation", "AI UX"], "summary": "IUIs aim to improve efficiency, effectiveness and naturalness of interaction by representing, reasoning and acting on models of the user, domain, task, discourse and media (Maybury 1999): they adapt, learn, anticipate needs and take initiative. Key test: is computational intelligence part of the interaction itself?", "points": [{"text": "IUI characteristics: adapts to needs of different users; learns new concepts/techniques; anticipates user needs; takes initiative and makes suggestions. Shown as a spectrum from AI to HCI — 'Where the AI stops and the UI begins is difficult to identify? And maybe not meaningful?'", "ref": "7-1 p3"}, {"text": "Classes: adaptive/predictive (predict user aims); informative/recommender (filter/summarise, recommend from own + others' history); generative (produce data values so user needn't specify); agent-based/chatbots (autonomous; conversational agents, often domain-constrained).", "ref": "7-1 p4"}, {"text": "Web examples: prefetch likely next page → faster browsing; summarise/hide irrelevant content → less distraction; auto-fill forms, suggest query terms → less typing; auction agent buys per profile → less effort.", "ref": "7-1 p14"}, {"text": "Features: inference, adaptation, personalisation, prediction, natural-language interaction, context awareness, recommendation, automation/agency, generative, explanation, learning. Adaptation examples: autocomplete, Intellisense, predictive text, URL autocomplete ('frecency'), grammar suggestions, Excel error detection, Copilot — 'Are any of these intelligent?'", "ref": "7-1 p6"}, {"text": "IUI interaction loop: User → Interface → Intelligent inference → Adaptation/action; observes what the user says, clicks, did previously, apparent goals, context, available info. Library search IUI: interpret query, infer need, reformulate, recommend, learn, explain why. 'An interface can contain AI without necessarily being an IUI.'", "ref": "7-1 p18"}, {"text": "Recommenders ('YouTube algorithm') use likes, CTR, watch time, recency of topic viewing, 'Not interested', search & watch history, demographics/location. Control problem: Dislike stops only 12% and 'Not interested' 11% of bad recommendations.", "ref": "7-1 p10"}, {"text": "Agents/assistants: contrast with direct manipulation; autonomous; proactive or reactive; good for well-defined tasks and off-loading simple tasks. Issues: personification, control, trust, delegation.", "ref": "7-1 p13"}, {"text": "Agentic interfaces ('AI that executes'): send messages/make purchases across apps, keep running when app closed; task → plan → execute → monitor → adjust; may ask permission. Should show how they decide, show intermediate outputs, and let users interrupt/modify planned actions.", "ref": "7-1 p21"}, {"text": "IUI goal: make humans more efficient, make fewer errors, deal with information overload; method: integrate user models, system models, behaviour, knowledge bases; alter the user's environment.", "ref": "7-1 p27"}], "apply": ["Transparency: does the UI explain why it suggested/did something and show what data it used and records?", "Control: can the user override, undo, dismiss, turn off, or interrupt the AI, and tune its inputs (unlike YouTube Dislike)?", "Errors: what does a wrong inference cost? Irreversible actions need confirmation/undo; generative errors should be easy to spot and fix.", "Timing: is assistance proactive or reactive — offered at the right time/place without hand-holding experts (Clippy)?", "Trust: are outputs labelled as AI, with a non-AI alternative for wary users?", "Does adaptation keep the UI consistent (see frequency/recency adaptive menus)?"], "limits": [{"text": "Speculative action can execute the wrong task (shopping agent buys wrong item at wrong price), especially tasks without easy undo.", "ref": "7-1 p15"}, {"text": "Generative IUIs make mistakes (e.g. fill a form wrongly) — low cost if spotted, relatively easy to correct.", "ref": "7-1 p15"}, {"text": "Implicit data sources: monitoring of activity — does the UI make clear what is being recorded?", "ref": "7-1 p16"}, {"text": "Trustworthiness: generative text is confidently wrong ('hallucinations') — e.g. lawyers citing fake ChatGPT cases.", "ref": "7-1 p16"}, {"text": "Proactive assistance at the wrong time/place destroys trust; hand-holding that helps first-hour testers ruins the feature for experts (Clippy).", "ref": "7-1 p5"}], "examples": [{"text": "Clippy — proactive help gone wrong; Siri et al. more reactive", "ref": "7-1 p5"}, {"text": "YouTube recommendations and weak negative-feedback controls", "ref": "7-1 p11"}, {"text": "Rhema: adaptive feedback for public speaking (adapts to speaker's voice, not audience)", "ref": "7-1 p8"}, {"text": "LinkedVis: interactive visual career recommender from LinkedIn data", "ref": "7-1 p12"}], "quotes": [{"text": "Proactive assistance at the wrong time, in the wrong place can destroy trust.", "ref": "7-1 p5"}, {"text": "An interface can contain AI without necessarily being an IUI.", "ref": "7-1 p18"}, {"text": "Agentic systems should enable users to interrupt and modify planned actions when desired by the user.", "ref": "7-1 p22"}], "related": ["ai-design-tools", "frequency", "recency", "voice", "error-prevention", "ethics"], "keySlides": ["7-1 p3", "7-1 p4"]}, {"id": "ai-design-tools", "name": "AI Tools for UX Design", "group": "awareness", "lecture": "7-1", "aliases": ["AI for design", "generative AI", "gen AI", "AI prototyping", "Figma Make", "Claude Design", "AI personas", "artifact generation", "artefact generation", "AI risks", "hallucination", "sycophancy"], "summary": "Using AI to make UX activities more effective: generative AI for prototyping (text, images, code) and for insights/summarisation of participant data — weighed against risks (incorrect outputs, privacy, IP, bias, overreliance).", "points": [{"text": "Generative AI for prototyping: text, images, code.", "ref": "7-1 p24"}, {"text": "Insights from / summarisation of participant data: textual data can work but systems usually lack context; visual input: premature (NN/g).", "ref": "7-1 p24"}, {"text": "Figma Make workflow: 1 describe what you're making (plain language or an existing frame) → 2 generate a few versions → 3 refine (prompt, edit visually, or code) → 4 share and keep going (gather team feedback).", "ref": "7-1 p25"}, {"text": "Risk — incorrect outputs: hallucinations, misinformation, sycophancy ('validating doubts, fueling anger, urging impulsive actions, or reinforcing negative emotions').", "ref": "7-1 p26"}, {"text": "Risks — privacy & confidentiality; intellectual property (infringement, no ownership/copyright of generated artefacts); reputational damage; operational/business (cost, third-party dependencies, overreliance).", "ref": "7-1 p26"}, {"text": "Risk — bias and discrimination, e.g. in persona generation (AI personas not grounded in real research data).", "ref": "7-1 p26"}, {"text": "Generative text is confidently wrong ('hallucinations') — trustworthiness issue.", "ref": "7-1 p16"}], "apply": ["Was AI output (persona, scenario, summary, screen) validated against real user data, or is it standing in for users?", "Did participant data go to a third-party AI — is that covered by consent/confidentiality promised to participants?", "Could generated personas/content encode bias or stereotypes?", "Who owns the generated artefacts; any IP infringement risk?", "Was AI used for breadth (several versions quickly) with humans judging and refining — or did overreliance replace design reasoning?"], "limits": [{"text": "Systems usually lack context for participant data; visual analysis is premature.", "ref": "7-1 p24"}, {"text": "Bias in generated personas; no copyright in generated artefacts; dependence on third parties and cost.", "ref": "7-1 p26"}, {"text": "Ethical obligation: user-related study material must be protected/deleted as promised.", "ref": "12-1 p4"}], "examples": [{"text": "Figma Make: generate a design with AI in 4 steps", "ref": "7-1 p25"}], "quotes": [{"text": "Textual data can work but systems usually lack context", "ref": "7-1 p24"}, {"text": "Bias and discrimination e.g. for persona generation", "ref": "7-1 p26"}], "related": ["ai-iui", "ethics", "personas", "digital-prototyping", "paper-prototyping"], "keySlides": ["7-1 p25", "7-1 p26"]}, {"id": "ambient", "name": "Ambient Displays", "group": "awareness", "lecture": "7-2", "aliases": ["ambient", "ambient display", "ambient interface", "calm technology", "peripheral display", "ambient orb", "ubiquitous computing", "Weiser"], "summary": "Information moved off the screen into the physical environment as subtle changes in form, movement, sound, colour, smell, temperature or light — to keep users aware of people or general states (network traffic, weather) without demanding attention (Ishii et al. 1998).", "points": [{"text": "Ishii et al. (1998): info manifests as subtle changes in form, movement, sound, colour, smell, temperature, light; suited to awareness of people or general states of large systems (network traffic, weather).", "ref": "7-2 p2"}, {"text": "Features: display info that is important but NOT critical; can move from periphery to focus of attention and back; tangible representations in the environment; subtle (non-distracting) updates; aesthetically pleasing and environmentally appropriate.", "ref": "7-2 p3"}, {"text": "Pousman & Stasko (2006) design dimensions: Information Capacity, Representational Fidelity, Notification Level, Aesthetic Emphasis.", "ref": "7-2 p3"}, {"text": "From 'calm technology' (Weiser & Brown 1996): stays in peripheral attention, moves to central attention only when necessary; low level of interaction; unobtrusive, less cognitive attention.", "ref": "7-2 p4"}, {"text": "Notification level = how much interruption: designer-intended level of alert v user-perceived level of alert.", "ref": "7-2 p6"}, {"text": "Information capacity: how much can sound, light, smell… carry? Bandwidth of senses: sight ≫ touch > hearing/smell > taste.", "ref": "7-2 p7"}, {"text": "Representational fidelity: how data is encoded (numbers, symbols, colours, brightness, sounds, odours, taste, air flow) and how accurately. Smell: convey by quality/presence-absence, not quantity/intensity (Kaye 2004).", "ref": "7-2 p9"}, {"text": "Basic ambient model: digital variable (model/data source) → physical representation of digital information (one-way). Ambient Garden adds interaction → edges towards tangible.", "ref": "7-2 p20"}, {"text": "Mappings seen: dog location → light; stock changes → colour; currency → water height; email → flower status; variable → bubble position; fire → wasabi; stock price → number of mountains. Connected to infovis and haptics (e.g. phone vibration as an additional feedback channel).", "ref": "7-2 p19"}], "apply": ["Is the information important but not critical (fits the periphery)? If urgent, use an alert instead.", "Which sense/physical property encodes the data, and is its capacity/fidelity enough for the decision users make?", "Does the notification level users perceive match what the designer intended (not distracting)?", "Is the mapping learnable/intuitive, and does it fit aesthetically where it will live?", "Could an ambient/haptic channel add a redundant, low-attention cue (e.g. vibration scaled to purchase size)?"], "limits": [{"text": "Not for urgent info: the wasabi smoke alarm uses the environment but conveys urgent information, so it is not ambient.", "ref": "7-2 p10"}, {"text": "Low capacity/fidelity of non-visual senses; can't reliably convey quantities by smell intensity.", "ref": "7-2 p11"}, {"text": "Mismatch between designer-intended and user-perceived alert level.", "ref": "7-2 p6"}, {"text": "Physical devices are costly to build, control, modify, maintain and distribute ('atoms are expensive').", "ref": "7-2 p29"}], "examples": [{"text": "cAMpanion: lightbox showing remote pet dog's activity via 3 colours", "ref": "7-2 p5"}, {"text": "Ambient Orb: glows colour for stock market changes", "ref": "7-2 p13"}, {"text": "DataFountain: currency values as water fountain heights", "ref": "7-2 p14"}, {"text": "MoneyColor: sky colour = trading time, mountains = price, trees = volume", "ref": "7-2 p16"}, {"text": "Digital photo frames, stock tickers — ambient?", "ref": "7-2 p21"}], "quotes": [{"text": "The most profound technologies are those that disappear. They weave themselves into the fabric of everyday life until they are indistinguishable from it.", "ref": "7-2 p30"}, {"text": "Display information that is important but not critical", "ref": "7-2 p3"}], "related": ["tangible", "infovis", "redundancy", "human-capabilities", "voice"], "keySlides": ["7-2 p20", "7-2 p8", "7-2 p16"]}, {"id": "tangible", "name": "Tangible Interfaces", "group": "awareness", "lecture": "7-2", "aliases": ["tangible", "TUI", "tangible user interface", "tangible interaction", "marble answer machine", "physical interface", "graspable"], "summary": "Physical objects act as both representation and control of digital information: they are computationally coupled to a digital model, so physically manipulating them changes the model and the view (e.g. Durrell Bishop's Marble Answer Machine).", "points": [{"text": "Standard desktop: strong physical separation between view and control — looking at your mouse doesn't tell you much about the state of the system.", "ref": "7-2 p26"}, {"text": "Tangible interaction model: graspable physical control + physical information representation (marble); non-graspable 'digital' representation (light colour); physical interaction affects Model AND View; may also need a digital data source as input.", "ref": "7-2 p27"}, {"text": "Key characteristics: physical representations are computationally coupled to digital info (new marble arrives when a message is queued; moving a marble alters the queue) and embody mechanisms for interactive control (move a marble to 'play').", "ref": "7-2 p28"}, {"text": "Also: physical representations are perceptually coupled to mediated digital representations (this marble = that message); physical state partially embodies digital state (number of marbles = queue length).", "ref": "7-2 p28"}, {"text": "Examples: Durrell Bishop Marble Answer Machine; SOPHYA (Waikato) linking physical and digital documents via RFID, LEDs, software; Reactable musical instrument; TRANSFORM shape display / dynamic furniture.", "ref": "7-2 p22"}, {"text": "Holmquist (2023) 'Bits are cheap, atoms are expensive': TUIs significantly more expensive to create, control, modify, maintain, mass-produce and distribute than GUIs.", "ref": "7-2 p29"}, {"text": "Ambient & tangible UIs encourage alternative ways of representing information and interacting; connected to infovis and haptic input/feedback (phone vibration as extra channel).", "ref": "7-2 p30"}], "apply": ["Does the physical object show system state at a glance (state embodied), unlike a mouse?", "Is manipulating the object the control (direct coupling), or is it just decoration?", "Is the physical–digital mapping perceptually obvious (which object = which data)?", "Is the cost of 'atoms' (build, maintain, distribute) justified versus a GUI?", "Could a tangible/haptic element suit the context (e.g. card/phone vibration feedback)?"], "limits": [{"text": "Atoms are expensive: cost to create, control, modify, maintain, mass-produce, distribute.", "ref": "7-2 p29"}, {"text": "Physical objects as diary 'entries' can be bulky, fragile, feel silly to collect.", "ref": "3-1 p17"}], "examples": [{"text": "Marble Answer Machine: each marble = a message; place in dish to play", "ref": "7-2 p22"}, {"text": "SOPHYA: RFID + LEDs link physical and digital documents", "ref": "7-2 p23"}, {"text": "Reactable tangible instrument", "ref": "7-2 p24"}, {"text": "TRANSFORM adaptive shape display / physical telepresence", "ref": "7-2 p25"}], "quotes": [{"text": "Looking at your mouse doesn’t tell you much about the state of the system", "ref": "7-2 p26"}, {"text": "atoms are very expensive compared to bits.", "ref": "7-2 p29"}], "related": ["ambient", "affordances", "infovis", "voice", "diary-studies"], "keySlides": ["7-2 p27", "7-2 p26"]}, {"id": "infovis", "name": "Information Visualisation", "group": "awareness", "lecture": "10-1", "aliases": ["infovis", "information visualization", "data visualisation", "data visualization", "dataviz", "charts", "graphs", "infographics", "visual analytics", "data storytelling", "Apperley", "Minard", "Sankey", "parallel coordinates"], "summary": "Presenting (often complex) information so we can efficiently and effectively extract the relevant features in and for our given context — and perhaps gain insight not possible without the particular visualisation (Mark Apperley).", "points": [{"text": "Definition: present (often complex) information so we can efficiently and effectively extract the relevant features in and for our given context… and perhaps gain insight which would not have been possible without the particular visualisation.", "ref": "10-1 p1"}, {"text": "Synonyms: data visualisation, scientific visualisation, visual analytics, info graphics, data storytelling. Novel infographics create context and attract interest.", "ref": "10-1 p2"}, {"text": "Innovative techniques become standard tools: box plots (outlier, min, lower quartile, median, upper quartile, max over a distribution — e.g. hours slept per weekday). Really simple visualisations make life easier and are self-explanatory (file-copy progress bar).", "ref": "10-1 p3"}, {"text": "Every representation selects relations: family tree shows ancestry, descendancy, generation (lines = relationship) but NOT time or place → add a time axis (and perhaps location, UK/NZ).", "ref": "10-1 p6"}, {"text": "Exploiting the familiar: maps — world 4 °C warmer, world population cartogram (countries sized by population), NZ Historical Atlas migration; Minard's Napoleon Moscow campaign (1869) as the classic.", "ref": "10-1 p7"}, {"text": "Perception pitfall: bubble charts — 'Which is bigger: A, or B + C + D + E? Is it area or radius which represents the value?'", "ref": "10-1 p10"}, {"text": "Time and structure: Fleetwood Mac line-up timeline 1968–2023; animated Auckland public transport map; London Underground (Harry Beck, 1931) — topological, not geographic; 'All You Zombies' time-travel 2-D timeline (calendar time v life as lived).", "ref": "10-1 p12"}, {"text": "Re-represent the same data for insight: 8760 hourly household loads unreadable over time → sort by load = load duration curve ('80% of time load between 350 and 1350 watts'); interactive — select a range on the curve, matching points highlight on the time plot; consumption v solar scatter shows effect of battery storage.", "ref": "10-1 p15"}, {"text": "Multidimensional/flow techniques: parallel coordinates (each dimension a vertical axis, each item a line — houses, cars); chord diagram (Uber rides between neighbourhoods); Sankey diagrams (2020 NZ election party v candidate vote split; personal income & expenses).", "ref": "10-1 p18"}], "apply": ["What features must THIS user extract in THIS context — does the visualisation make them directly visible?", "Is the encoding perceptually honest (position/length over area; area not radius for bubbles)?", "Would re-sorting or re-aggregating (e.g. spending by size or category instead of date) reveal insight?", "Is interaction needed (select/filter, highlight linked views) to explore the data?", "Familiar form (map, timeline, progress bar, bar chart) or novel — can the audience read it? Apply data-ink to strip clutter."], "limits": [{"text": "Area v radius ambiguity makes size comparisons misleading.", "ref": "10-1 p10"}, {"text": "Any single view omits relationships (family tree: no time or place).", "ref": "10-1 p6"}, {"text": "Novel infographics attract interest but can be 'beautiful but terrible' (population pyramids link).", "ref": "10-1 p22"}, {"text": "Embellishment v data-ink: chartjunk may aid memorability/engagement but costs clarity.", "ref": "10-2 p28"}], "examples": [{"text": "Minard's map of Napoleon's Moscow campaign (1869)", "ref": "10-1 p8"}, {"text": "London Underground map (Harry Beck, 1931)", "ref": "10-1 p13"}, {"text": "Household load duration curve + linked interactive time plot", "ref": "10-1 p15"}, {"text": "Sankey: how people split their votes in the 2020 NZ election", "ref": "10-1 p19"}, {"text": "'The World as 100 People' infographic", "ref": "10-1 p11"}], "quotes": [{"text": "The real voyage of discovery consists not in seeking new landscapes but in having new eyes.", "ref": "10-1 p13"}, {"text": "Visualisations can be interactive, to allow exploration of the data", "ref": "10-1 p15"}], "related": ["data-ink", "ambient", "tangible", "accessibility", "human-capabilities"], "keySlides": ["10-1 p8", "10-1 p15", "10-1 p18"]}, {"id": "accessibility", "name": "Accessibility", "group": "awareness", "lecture": "11-1", "aliases": ["a11y", "accessible design", "disability", "colour blindness", "color blindness", "screen reader", "visual impairment", "pour", "wcag", "born accessible", "inclusive design", "braille", "assistive technology"], "summary": "Most commonly 'accessibility for people with disabilities' (e.g. visual impairment spectrum to blindness, colour blindness, hearing, dyslexia, keyboard-only). Design with redundancy, text alternatives, strong contrast, built-in structure, POUR, born-accessible from the start, and test with diverse users and tools.", "points": [{"text": "Most common computing usage: accessibility for people with disabilities. Visual impairment spectrum incl. colour blindness → blindness; also hearing impairment, dyslexic, keyboard-only, speech-audio only users.", "ref": "11-1 p5"}, {"text": "Colour blindness (red-green most common; 8% males / 1% females per 3-2 p12): don't use colour as the only means of conveying info — want (good) redundancy; one channel only hurts some users.", "ref": "11-1 p6"}, {"text": "Colour design: test in simulator; B&W/strong contrast first — do you need colour?; shading/hatching; no rainbow gradients; reinforce colour with text/icons; strong contrasts (blue, yellow, white, black); avoid small coloured items; not 'press the red button' → 'press the button marked ON'.", "ref": "11-1 p7"}, {"text": "Screen readers re-present screen content, mostly text-to-speech; easy in single-column text UIs, harder with images, links, frames.", "ref": "11-1 p9"}, {"text": "Designing for visual impairment: awareness; text alternatives; strong contrast; test with diverse participants; test with screen readers & simulators; use guidelines (W3C WAI) and testing tools.", "ref": "11-1 p14"}, {"text": "POUR: Perceivable (sight + assistive tech), Operable (keyboard/AT navigation at minimum), Understandable (no colour-only/complex symbols without secondary means), Robust (multiple ways to interpret & navigate).", "ref": "11-1 p17"}, {"text": "Use built-in structure (headings, styles, lists; native HTML/CSS > lots of JS); alternatives for multimedia (captions); care about tab order; informative starts of headings/paragraphs; avoid 'Click here'; test zoomed/magnified.", "ref": "11-1 p18"}, {"text": "Born-accessible: integrate as early as possible; involve people with disabilities throughout; documented plan; on by default; compatible with assistive tech.", "ref": "11-1 p19"}, {"text": "Strategies: awareness; find standards & tools; try a screen reader yourself; best practice & legal requirements; negative personas — who is excluded?; be explicit about technology & user-capability requirements; engage representative users.", "ref": "11-1 p20"}], "apply": ["Is any information conveyed by colour alone (status, errors, charts)?", "Do all images/icons have text alternatives; does it work with a screen reader and keyboard only?", "Check POUR: perceivable, operable, understandable, robust — which fails?", "Contrast & target size: readable when zoomed, in sunlight, by older users?", "Who is excluded by this design (negative persona)? Were disabled users involved in testing?"], "limits": [{"text": "Visual/complex interfaces (images, links, frames) are harder for screen readers.", "ref": "11-1 p9"}, {"text": "Heavy JavaScript usually yields worse accessibility than built-in HTML/CSS.", "ref": "11-1 p18"}, {"text": "Retro-fitting late is harder — hence 'born-accessible'.", "ref": "11-1 p19"}], "examples": [{"text": "OneStep (KNFB) Reader: phone camera + OCR + text-to-speech.", "ref": "11-1 p9"}, {"text": "Dot braille e-reader / Dot Pad tactile display.", "ref": "11-1 p10"}, {"text": "Be My AI: camera + image recognition + ChatGPT.", "ref": "11-1 p13"}, {"text": "Word document accessibility features (alt text, captions).", "ref": "11-1 p16"}], "quotes": [{"text": "Don't use colour as the only means of conveying information", "ref": "11-1 p6"}, {"text": "Don't use text which refers to objects only by colour (\"press the red button\")", "ref": "11-1 p7"}], "related": ["user-diversity", "redundancy", "data-ink", "human-capabilities", "internationalisation", "personas", "nielsen-heuristics"], "keySlides": ["11-1 p17", "11-1 p7"]}, {"id": "internationalisation", "name": "Internationalisation & Localisation", "group": "awareness", "lecture": "11-2", "aliases": ["i18n", "internationalization", "localisation", "localization", "l10n", "g11n", "globalisation", "locale", "unicode", "utf-8", "rtl", "right to left", "date formats", "translation", "technical debt"], "summary": "Internationalisation (i18n) = designing/building so a product can be easily localised; localisation (L10N) = adapting it to a specific locale's language/culture. Get the architecture right early (externalise text, UTF-8, locale structures) and question every 'universal' element.", "points": [{"text": "i18n: \"design and development of a product… that enables easy localization for target audiences that vary in culture, region, or language\" (W3C). Also globalisation (g11n).", "ref": "11-2 p12"}, {"text": "L10N: \"adaptation of a product… to meet the language, cultural and other requirements of a specific target market (a locale)\". Locale = grouping of differences (en-US, en-NZ).", "ref": "11-2 p12"}, {"text": "In practice: an internationalised app may only be usable in one language, but adding another is easier — i18n is getting the architecture/infrastructure right; language text is the central problem.", "ref": "11-2 p13"}, {"text": "Text complexity: languages ≠ countries; direction LTR/RTL; accents & special characters; differing conventions (quotation marks).", "ref": "11-2 p14"}, {"text": "Encodings: ASCII (1963, 7-bit, 128 chars) → ISO 8859-1/Windows-1252 one-byte → Unicode (1991, unique number per character; U+hex; BMP 0000–FFFF; full to 10FFFF); UTF-8 most widely used.", "ref": "11-2 p19"}, {"text": "Variations: dates (US mm/dd/yyyy oddity), names, currency, number formats, language/spelling, nationality, electricity, address formats, phone numbers, paper sizes, measurement systems, sizes, text direction/capitalisation, colours, keyboards & shortcuts, maps/borders, seasons/holidays, first day of week.", "ref": "11-2 p24"}, {"text": "Technical debt: easy short-term code (e.g. global French=Yes flag + hundreds of if-then-else) blocks later languages (Japanese ≠ 'one more week'); Amazon needed Unicode across consumer stack.", "ref": "11-2 p31"}, {"text": "Your personal experience is not representative or a good guide; names, numbers, dates, maps aren't universal.", "ref": "11-2 p33"}, {"text": "Designing for i18n: awareness; externalise text; think start/finish not left/right (icons too); use locale structures; heuristic: use UTF-8; per element ask: same worldwide? politically sensitive? what change would break the assumption?; test with multiple languages, diverse data & participants.", "ref": "11-2 p34"}], "apply": ["Is all UI text externalised (not hard-coded) and does layout survive longer translations and RTL?", "Are dates, currency, numbers, names, addresses formatted via locale rather than assumed NZ/US?", "Does data handling use UTF-8 (macrons e.g. Māori place names, emoji, non-Latin scripts)?", "Any politically sensitive elements (maps, borders, country lists, flags)?", "Tested with diverse test data (Big List of Naughty Strings) and participants from other locales?"], "limits": [{"text": "Many differences occur WITHIN national boundaries despite the name.", "ref": "11-2 p3"}, {"text": "Retrofitting creates technical debt — costly to fix late.", "ref": "11-2 p30"}, {"text": "Many differences to care about (layout, interpretation, I/O, data formats) — can't anticipate all.", "ref": "11-2 p23"}], "examples": [{"text": "Windows 95: 8 pixels shading Kashmir differently → banned in India, 200,000 copies recalled, cost millions.", "ref": "11-2 p5"}, {"text": "Marriott listed Tibet, Taiwan, HK, Macau as countries → Chinese sites shut a week.", "ref": "11-2 p9"}, {"text": "Xero (NZ small market, expanding globally): user request — PO delivery address not in Australian format (should be 'Jonesville VIC 3000' on one line).", "ref": "11-2 p7"}, {"text": "Weight in stone (1 stone = 14 lb) on a TV programme — unit only understood in one country.", "ref": "11-2 p25"}, {"text": "Stuff article (Marokopa): 'rāhui' displayed as 'rÄhui' — macron mangled by character-encoding mismatch.", "ref": "11-2 p17"}], "quotes": [{"text": "Internationalisation is getting the architecture/infrastructure right", "ref": "11-2 p13"}, {"text": "Think in terms of start and finish, not left and right (for icons as well as text)", "ref": "11-2 p34"}], "related": ["user-diversity", "accessibility", "ethics", "personas", "platform-guidelines"], "keySlides": ["11-2 p24", "11-2 p34", "11-2 p5"]}, {"id": "user-diversity", "name": "User Diversity & the Digital Divide", "group": "awareness", "lecture": "11-1", "aliases": ["diversity", "digital divide", "inclusion", "inclusive design", "users are not like you", "user differences", "older users", "low literacy", "connectivity", "w3c wai"], "summary": "Users differ on many dimensions beyond disability (W3C WAI list); the digital divide excludes the poor, rural, elderly and disabled, and also those lacking skills, literacy/language, time.", "points": [{"text": "User Diversity dimensions: accessibility for people with disabilities; access to & quality of hardware, software and Internet connectivity; computer literacy and skills; economic situation; education; geographic location; culture; age (older and younger); language; …", "ref": "11-1 p2"}, {"text": "Same list reused for internationalisation — many of these differences occur within national boundaries.", "ref": "11-2 p3"}, {"text": "Digital divide: gap for underprivileged — poor, rural, elderly, handicapped — without computer/internet access.", "ref": "11-1 p3"}, {"text": "Divide takes other forms (Corbett & Cochrane 2020): lack of technical skills; literacy or linguistic skills; different abilities (intellectual, visual); connected but no time privilege to engage.", "ref": "11-1 p3"}, {"text": "Each person is different: physical & cognitive differences — age, sex, height, vision, disability.", "ref": "3-2 p3"}, {"text": "Diversity of use: contextual factors (ambient noise, sunlight, reflections); cognitive factors (attention, memory, emotion, stress).", "ref": "3-2 p4"}, {"text": "'Device diversity is human diversity.'", "ref": "6-1 p34"}, {"text": "Be explicit about technology requirements and user capabilities required; ask who is excluded (negative personas); engage representative groups.", "ref": "11-1 p20"}], "apply": ["Which diversity dimensions does the design assume (new phone, fast internet, high digital literacy, English, NZ)?", "Who is excluded? Write a negative persona / list excluded groups.", "Does removing an old channel (cheques, phone, paper) cut off a group?", "Were test participants diverse (age, ability, language, location)?"], "limits": [{"text": "Majority-driven decisions (<1% cheque use) can exclude minorities e.g. older people (Grey Power campaign).", "ref": "11-1 p4"}, {"text": "Assuming users are like you = 'fundamental attribution error of design'.", "ref": "12-1 p21"}], "examples": [{"text": "ASB and other NZ banks phasing out cheques (<1% of payments) → Grey Power campaign.", "ref": "11-1 p4"}, {"text": "RNZ: digital divide hurting a new cohort of kids.", "ref": "11-1 p3"}], "quotes": [{"text": "Assuming that your users are just like you can be described as a fundamental attribution error of design", "ref": "12-1 p21"}], "related": ["accessibility", "internationalisation", "human-capabilities", "personas", "ethics"], "keySlides": ["11-1 p2"]}], "imgs": {}}</script>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const MODE = DATA.mode; // "personal" | "public"
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("cx324:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("cx324:" + k, JSON.stringify(v)); } catch {} }
};
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 1800); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { toast("Copy blocked — select the text and press Ctrl+C"); }
}

/* ---------- reference data ---------- */
const CONCEPTS = DATA.concepts;
const CBYID = Object.fromEntries(CONCEPTS.map(c => [c.id, c]));
const GROUPS = [["principle", "Design principles"], ["technique", "Techniques"], ["awareness", "Awareness"]];
const LTITLES = DATA.lectureTitles;
const EVID = DATA.evidence || {};
const SCREENS = Object.fromEntries((DATA.screens || []).map(s => [s.id, s]));

/* ---------- search engine (BM25 + stems + fuzzy) ---------- */
const STOP = new Set("a an and are as at be by for from has have how i in is it its of on or that the this to was were what when which with you your can do does into their them they not but if than then there these those we our us".split(" "));

  if (w.length > 6 && w.endsWith("ing")) return w.slice(0, -3);
  if (w.length > 5 && w.endsWith("ed")) return w.slice(0, -2);
  if (w.length > 4 && w.endsWith("es") && !w.endsWith("ses")) return w.slice(0, -1);
  if (w.length > 3 && w.endsWith("s") && !w.endsWith("ss")) return w.slice(0, -1);

}
function toks(s) {
  return String(s || "").toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9]+/g, " ").split(" ").filter(w => w && !STOP.has(w)).map(stem);
}
const IDX = { docs: [], df: new Map(), vocab: [], avg: 0 };
function addDoc(d) { // d: {type, key, title, text, boost}
  const t = toks(d.title + " " + d.title + " " + d.text);
  const tf = new Map(); for (const w of t) tf.set(w, (tf.get(w) || 0) + 1);
  d.tf = tf; d.len = t.length; IDX.docs.push(d);
}
function finishIndex() {

  for (const d of IDX.docs) { tot += d.len; for (const w of d.tf.keys()) IDX.df.set(w, (IDX.df.get(w) || 0) + 1); }

}
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;

}
function expand(q) { // -> [{term, w}]
  const qt = toks(q); const out = new Map();
  qt.forEach((t, i) => {
    const last = i === qt.length - 1;
    if (IDX.df.has(t)) out.set(t, Math.max(out.get(t) || 0, 1));
    else if (t.length >= 4) {
      const max = t.length >= 8 ? 2 : 1;
      for (const v of IDX.vocab) if (v[0] === t[0] && lev(t, v, max) <= max) out.set(v, Math.max(out.get(v) || 0, .8));

}
function search(q, filter) {

  const N = IDX.docs.length, k1 = 1.2, b = .75, ql = q.toLowerCase().trim();
  const res = [];
  for (const d of IDX.docs) {
    if (filter && !filter(d)) continue;
    let s = 0, hits = 0;
    for (const { term, w } of terms) {
      const f = d.tf.get(term); if (!f) continue; hits++;

    }

    s *= (d.boost || 1) * (0.6 + 0.4 * hits / terms.length);

}

/* ---------- state + routing ---------- */
const VIEWS = [["lookup", "Lookup", "1"], ["build", "Build answer", "2"]];

const S = { view: "lookup", q: "", filter: "all", detail: null, sel: null };
function setView(v) { if (v !== S.view) pushNav(); S.view = v; try { history.replaceState(null, "", "#" + v); } catch {} render(); }
/* back trail: every jump remembers where you were, including scroll */
const NAV = [];
function paneScroll() { return { main: ($("#view") || $("#right"))?.scrollTop || 0, left: $("#left")?.scrollTop || 0 }; }
function snap() { return { view: S.view, detail: S.detail ? { ...S.detail } : null, sel: S.sel, q: S.q, filter: S.filter, scroll: paneScroll() }; }
function sameSnap(a, b) { return a.view === b.view && JSON.stringify(a.detail) === JSON.stringify(b.detail) && a.q === b.q; }

  if (sn.view !== "lookup") return VIEWS.find(v => v[0] === sn.view)?.[1] || sn.view;
  if (!sn.detail) return sn.q ? `results for “${sn.q.length > 18 ? sn.q.slice(0, 18) + "…" : sn.q}”` : "Lookup";
  if (sn.detail.type === "concept") return CBYID[sn.detail.id]?.name || "card";
  if (sn.detail.type === "page") return sn.detail.ref;
  return "incident";
}
function goBack() {
  const sn = NAV.pop(); if (!sn) { if (S.detail) { S.detail = null; S.sel = null; render(); } return; }
  Object.assign(S, { view: sn.view, detail: sn.detail, sel: sn.sel, q: sn.q, filter: sn.filter });
  try { history.replaceState(null, "", "#" + sn.view); } catch {}
  render();
  requestAnimationFrame(() => { const m = $("#view") || $("#right"); if (m) m.scrollTop = sn.scroll.main; const l = $("#left"); if (l) l.scrollTop = sn.scroll.left; });
}
function renderBack() {
  const b = $("#navBack"); if (!b) return; const top = NAV[NAV.length - 1];
  b.hidden = !top; if (top) { b.querySelector("span").textContent = navLabel(top); b.title = "Back to " + navLabel(top) + " (Alt+← or Backspace)"; }
  const mb = document.querySelector(".backbtn"); if (mb) mb.textContent = "← Back to " + (top ? navLabel(top) : "results");

}

function render() {

function budgetMs(q) { const tm = totalMarks(); if (!tm) return 0; return (+q.marks || 0) / tm * (EX.dur - EX.review) * 60000; }

}

function buildPrompt(q, ctx) {

    ...(c.limits || []).map(p => `- Limit: ${p.text} [${p.ref}]`), ...(c.examples || []).map(p => `- Example: ${p.text} [${p.ref}]`)].join("\n");
  const index = CONCEPTS.map(c => `${c.name} (${c.lecture}): ${c.summary}`).join("\n");
  const ev = relC.flatMap(c => (EVID[c.id] || []).map(e => `- (${c.name}) [${e.ref}] ${e.phase} · ${SCREENS[e.screen]?.name || ""} · ${e.stance.toUpperCase()}: ${e.point} → ${e.argue || ""}`)).join("\n");
  const inc = (DATA.incidents || []).filter(e => ctx === "error" || (e.concepts || []).some(x => ids.has(x))).map(e => `- [${e.ref}] ${e.who}: ${e.what} (angle: ${e.angle}; concepts: ${(e.concepts || []).join(", ")})`).join("\n");
  const meth = (DATA.methods || []).filter(m => ids.has(m.concept) || ctx === "scenario").map(m => `- [${m.ref}] ${m.concept}: ${m.what}. Worked: ${m.worked}. Problems: ${m.problems}`).join("\n");
  const scr = (DATA.screens || []).filter(s => ctx === "general" || ctx === "error" || ctx === "scenario" ? false : s.phase === ctx).map(s => `- [${s.ref}] ${s.name}: ${s.desc}`).join("\n");
  const GENERIC = /\b(eval\w*|analy\w*|prototypes?|proto|phase|p[123]|i{1,3}|using|use|your|own|question|part|parts|design|give|suggest|two|2|explain|discuss|describe|wrt|respect|perspective|principles?|via|eg|e\.g)\b/gi;
  const slideQ = q.replace(GENERIC, " ") + " " + relC.slice(0, 4).map(c => c.name + " " + (c.aliases || []).slice(0, 3).join(" ")).join(" ");
  const pageOf = k => { const [d, p] = [k.slice(0, k.lastIndexOf(" p")), +k.slice(k.lastIndexOf(" p") + 2)]; return DOCS[d] && DOCS[d].pages[p - 1] != null ? `### [${k}] ${DOCS[d].title}\n${DOCS[d].pages[p - 1]}` : null; };
  const cited = [], seen = new Set();
  const addKey = (k, arr) => { if (k && !seen.has(k)) { seen.add(k); arr.push(k); } };
  for (const c of relC.slice(0, 5)) for (const p of [...(c.points || []), ...(c.limits || []), ...(c.examples || [])]) { const n = normRef(p.ref); if (n && !/^P/.test(n.doc)) addKey(n.doc + " p" + n.page, cited); }
  search(slideQ, d => d.type === "slide").slice(0, 10).forEach(h => addKey(h.d.key, cited));
  const slides = cited.slice(0, 40).map(pageOf).filter(Boolean).join("\n\n");
  const mine = [];
  for (const c of relC) for (const e of (EVID[c.id] || [])) { const n = normRef(e.ref); if (n && (ctx !== "P2" && ctx !== "P3" || n.doc === ctx)) addKey(n.doc + " p" + n.page, mine); }
  const subF = ctx === "P2" || ctx === "P3" ? d => d.type === "mine" && d.key.startsWith(ctx) : d => d.type === "mine";
  search(slideQ, subF).slice(0, 6).forEach(h => addKey(h.d.key, mine));
  const subs = mine.slice(0, 14).map(pageOf).filter(Boolean).join("\n\n");
  const ctxName = CONTEXTS.find(c => c[0] === ctx)?.[1] || ctx;
  const instr = `You are helping Billy, a final-year CS student, during an OPEN-BOOK online exam for COMPX324 User Experience Design (University of Waikato, 2026; lecturer David Nichols). He typed the exam question below in his own shorthand. Your job is NOT to write his answer. Your job is to tell him which points from which of his course resources are relevant, and how they could be used to build an argument, so he can write the answer himself.

Question (his shorthand): ${q}
Context he chose: ${ctxName}

Reply in Markdown with exactly these sections:
## What it's asking
One or two lines: the parts (a)/(b), the command words (evaluate / analyse / give / suggest / compare), and what a strong answer must contain.
## Relevant points
For each part, the 3–6 most relevant lecture points. One bullet each: the point in a few words, then its reference in square brackets exactly as given in the material, e.g. [6-2 p4]. Prefer the lecturer's terms.
## Evidence from his project
Specific screens, findings or incidents from his own submissions that he can cite, with refs like [P3 p9], and whether each supports or violates the principle. Skip this section if the context is a given scenario or general.
## Argument outline
Per part: Claim → Evidence (ref) → Reasoning that links evidence to the principle → Counterpoint or trade-off → Improvement. Terse bullets, not prose paragraphs.
## Watch out
1–3 traps: common misreadings, confusions between similar concepts, or limitations he should acknowledge.

Rules: cite only references that appear in the material below; never invent page numbers. If the material doesn't cover something, say "not in your material" and give general UX knowledge marked (general). Be concise: he is under time pressure.`;
  const parts = [instr,
    "\n=== CONCEPT INDEX (all examinable concepts) ===\n" + index,
    "\n=== MOST RELEVANT CONCEPT CARDS ===\n" + relC.map(cardTxt).join("\n\n"),
    ev ? "\n=== HIS MAPPED PROJECT EVIDENCE ===\n" + ev : "",
    scr ? "\n=== HIS PROTOTYPE SCREENS (" + ctx + ") ===\n" + scr : "",

}
async function runAsk() {

  renderAsk(); $("#aout").innerHTML = `<div class="thinking"><span class="dot"></span>Thinking… the deeper settings can take up to a minute.</div>`;
  try {
    const r = await sampleFn(prompt, { signal: ASK.ctl.signal, modelTier: ASK.tier, onText: ({ text }) => { ASK.out = text; const o = $("#aout"); if (o) o.innerHTML = mdToHtml(text); } });

  } catch (e) {

    const msg = { cancelled: "", not_granted: "Claude access was declined for this page. Reload to be asked again.", sampling_disabled: "Claude isn't available on this account.", rate_limited: "Usage limit or too many requests. Wait a minute, then try again.", prompt_too_large: "Too much material was selected. Shorten the question.", refused: "Claude declined this one. Rephrase the question.", session_expired: "Sign in to Claude again, then retry." }[e?.code];

function mdToHtml(md) {
  const lines = esc(md).split("\n"); let html = "", list = null;
  const inline = s => linkRefs(s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>"));
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const l = raw.replace(/\s+$/, "");
    let m;
    if ((m = /^(#{1,4})\s+(.*)/.exec(l))) { close(); html += `<h3>${inline(m[2])}</h3>`; }
    else if ((m = /^\s*[-*•]\s+(.*)/.exec(l))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = /^\s*\d+[.)]\s+(.*)/.exec(l))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
    else if (!l.trim()) close();
    else { close(); html += `<p>${inline(l)}</p>`; }
  }
  close(); return html;
}

let pdfjsReady = null;
function getPdfjs() {

const pdfCache = new Map();
async function renderPdfPage(doc, p, canvas, scale) {

    const lib = await getPdfjs();
    let pdf = pdfCache.get(doc.id); if (!pdf) { pdf = await lib.getDocument({ data: await doc.pdf.arrayBuffer() }).promise; pdfCache.set(doc.id, pdf); }
    const page = await pdf.getPage(p); const vp = page.getViewport({ scale });

const IDB = {

};

", "fieldwork", "in the wild", "contextual inquiry", "shadowing", "fly on the wall", "Robinson framework", "Goetz and LeCompte", "triangulation"], "summary": "Watching what people actually do in their natural setting (‘in the wild’) rather than relying on what they say. Drawn from anthropology’s ethnography; in UX done as short, focused ‘ethnography-lite’, usually paired with interviews to get the ‘why’.", "points": [{"text": "Why observe, not just ask: people don’t know what they want, don’t know what is possible, sense something is inadequate but can’t explain it, can’t advise how to achieve it; ask if they want a feature and the answer is (almost) always yes. So find needs in more than one way.", "ref": "2-1 p3"}, {"text": "Ethnography: studies people ‘in the wild’ in real-world natural settings; focuses on actual behaviours (not what people say they do or think they ought to do); understands the task from participants’ perspective – their categories and language.", "ref": "2-1 p4"}, {"text": "Ethnographic techniques: analysis of records, artefacts, environment; observation; auto-ethnography; interviews linked to observation (formal/informal; structured/semi-structured/unstructured) to provide explanations, motivations, background.", "ref": "2-1 p5"}, {"text": "Participant observation: researcher takes part in the task while recording activity, thoughts, emotions, problems (audio/video/written, during or shortly after); reflects and uses this to guide interviews about motivations.", "ref": "2-1 p6"}, {"text": "Practicalities (party study): video/audio unacceptable; notes after the event incomplete; visible note-taking socially unacceptable and modifies behaviour. Gain acceptance as an ‘insider’ or via gatekeepers; use informants; triangulate across observations and researchers.", "ref": "2-1 p8"}, {"text": "What to record – Goetz & LeCompte (2-1 p16): Who? Role? What? When? Where? Why? How organised? Robinson: Space, Actors, Activities, Objects, Acts, Events, Goals, Feelings. Both also usable as interview prompts.", "ref": "2-1 p17"}, {"text": "Records / artefacts / environment: what info do records hold and how well do they support the behaviour; how do tools constrain/support; how do layout, temperature, time, lighting affect activity? (2-1 p20) Keep the positives, eliminate the negatives; ask who controls the environment (user agency).", "ref": "2-1 p27"}, {"text": "UX ‘ethnography-lite’: short, focused studies for fast product lifecycles; aim for “greatest level of strategically useful information”; narrow the wide-angle lens – choose informants carefully, strategically sample time periods, use multiple researchers.", "ref": "2-1 p18"}, {"text": "Auto-ethnography: you are researcher and participant. Good for debugging protocols, few participants (if you have domain experience), seeing participant’s view. Problem: you are not typical → over-customisation.", "ref": "2-1 p28"}], "apply": ["Are we looking at the right people at the right time? Cover all stakeholder groups, vary times/locations (weekday v weekend), include peak/critical events.", "Can you observe without interrupting the task (e.g. watch self-checkout use unobtrusively, then debrief afterwards) to keep behaviour natural?", "Use Robinson (Space, Actors, Activities, Objects, Acts, Events, Goals, Feelings) as a recording checklist.", "Pair with a short follow-up interview to recover motivations behind observed actions.", "Triangulate: several sessions, more than one observer, plus another technique (logs, diaries).", "Ethics: notice/consent, anonymise (F1, M5), avoid identifying recordings."], "limits": [{"text": "Method-comparison weakness: “are we looking at the right people at the right time?”", "ref": "2-2 p10"}, {"text": "Biases: selection must cover all stakeholders, times, unusual/critical events; observer expectations of ‘normal’ behaviour; confirmation bias; experimenter effects – knowing you’re observed changes behaviour.", "ref": "2-1 p19"}, {"text": "Shows what, not why: motivations need interviews linked to the observation.", "ref": "2-1 p5"}, {"text": "Criticisms: time (a rich picture can take years) → practical short, bounded studies; scale – not suited to statistical analysis/verification (fine-grained not coarse overview); trust → triangulation (several techniques, >1 researcher).", "ref": "2-1 p29"}, {"text": "Access & recording constraints: may need gatekeepers/invitations; recording may be unacceptable; notes afterwards incomplete.", "ref": "2-1 p8"}], "examples": [{"text": "Party music selection (Cunningham & Nichols 2009): one hand holding a drink while handling CDs → no fine motor movements; ‘drinking dyslexia’ → large readable display; food/drink/drunks → physically robust system.", "ref": "2-1 p11"}, {"text": "Skipping/deleting songs publicly → need to delete without disrupting party or insulting chooser; potential social embarrassment.", "ref": "2-1 p13"}, {"text": "Lecture room: analyse environment, artefacts, records; framing as ‘teaching’ v ‘learning’ changes the analysis and the design.", "ref": "2-1 p26"}, {"text": "Hoober’s real-world observations: people hold phones in multiple ways depending on device, needs, context – contradicts designers’ one-thumb iPhone assumption.", "ref": "6-1 p32"}, {"text": "Dan Russell’s field studies in people’s homes: 90% don’t know Ctrl/Cmd+F.", "ref": "12-1 p20"}], "quotes": [{"text": "Properly done, provides detailed insight into the concepts and premises that underlie what people do – but that they are often unaware of.", "ref": "2-1 p4"}, {"text": "Experimenter effects: the knowledge of being observed can affect the actions of the participant", "ref": "2-1 p19"}, {"text": "incomplete information is better than no information!", "ref": "2-1 p18"}], "related": ["interviews", "diary-studies", "questionnaires", "ethics", "requirements", "personas", "user-testing"], "keySlides": ["2-1 p17", "2-1 p19", "2-2 p10"]}, {"id": "interviews", "name": "Interviews", "group": "technique", "lecture": "2-2", "aliases": ["interview", "interviewing", "user interviews", "semi-structured interview", "structured interview", "unstructured interview", "interview protocol", "probes", "leading questions", "closed questions", "open-ended questions", "courtesy bias", "social desirability bias", "Kvale", "self-checkout", "ask people"], "summary": "An ‘ask people’ method: face-to-face, mainly open-ended questioning (semi-structured protocol + probes) to learn behaviours, emotions and motivations. Flexible, contextual, can follow up; suits up to ~10 people, ideally in the natural location of the activity.", "points": [{"text": "UX wants to know: specific behaviours (what people do, how they reach goals), emotions (how they feel about tasks/software), motivations (why) – then use insights to create better designs.", "ref": "2-2 p9"}, {"text": "Lecture’s method comparison – all methods have limitations: Interviews → do people remember incidents from weeks ago? Observations → right people at the right time? Diary studies → do people report everything; hard to keep up over long periods. Digital logs → separated from motivations, beliefs.", "ref": "2-2 p10"}, {"text": "Interview v questionnaire: interviews up to ~10 people; flexible, contextual, open-ended; easier/faster to speak than write; extra info from tone of voice, body language, surroundings (can demonstrate). Face-to-face response rates better. Cost similar (good questionnaires take time to build).", "ref": "2-2 p11"}, {"text": "Good interview: interviewer’s questions short, answers long; verify interpretations during the interview; prepare; consider location, documents/objects, environment. Kvale’s good interviewer (2-2 p13): knowledgeable, clear, gentle, sensitive, open, steering, critical, remembering, interpreting.", "ref": "2-2 p14"}, {"text": "Planning: interviewees from all categories of prospective users; schedule considerately, give start AND end time; interview at a location meaningful to the study (home, office) – people ‘open up’ and can ‘show’ you (2-2 p17); decide recording method (notes, audio, video, photos – can combine), consistent with ethics.", "ref": "2-2 p15"}, {"text": "Capture: audio recorder, notepaper, camera, example materials. Write questions beforehand (a ‘protocol’) but be prepared to deviate and follow interesting leads – the key advantage. Use a note-taking form; annotate from audio afterwards (2-2 p27).", "ref": "2-2 p16"}, {"text": "Language: avoid closed questions (‘Do you own an iPad?’ – better in questionnaires); avoid jargon, use their terms (‘web browser’ not ‘Firefox v152’); don’t correct or laugh at confusion (Internet ≠ Web ≠ browser).", "ref": "2-2 p18"}, {"text": "Avoid leading questions (‘Most people use websiteX – do you too?’, ‘this or the improved design I created?’) – bad science, bad data; even ‘developers tested this extensively’ biases. Don’t ask ‘what features do you want?’ – elicit a need, or a problem in the current system. Avoid loaded/compound questions (‘Cars should be faster and safer’) (2-2 p21).", "ref": "2-2 p19"}, {"text": "Techniques: follow a natural sequence (what happens next? big → small picture); prompts (‘can you tell me more about that?’); show-and-tell sensitive material; ask them to be the expert; echo their phrases (‘why you hate this application?’). Prepare probes per question and add new ones from earlier interviews (2-2 p26).", "ref": "2-2 p24"}], "apply": ["Self-checkout scenario – problems: interrupting people mid-task under queue/time pressure (task performance + their goodwill suffer); being watched/questioned changes behaviour (experimenter effects); courtesy & social desirability bias (won’t admit struggling, esp. in public or near staff); only reaches people at that time/store (sampling bias); hard to get informed consent & privacy (purchases, payment visible); short answers, no time to probe.", "Alternatives & what they fix: unobtrusive observation (actual behaviour, no interruption, varied times) + short debrief interview after checkout (motivations, without interrupting); digital logs from the machines (errors, ‘unexpected item’, staff calls – large scale, no bias, but no motivations); event-contingent diary study (each use, in own time, low memory reliance, private); questionnaire via receipt QR code (many people, anonymous, low courtesy bias, but low response, fixed answers); scheduled interview at a calm time/location with consent.", "Are questions open, neutral, single-concept and in the user’s own words? Rewrite leading/compound/closed ones.", "Does the sample cover all categories of users (older, tech-averse, large shops, staff) and different times?", "Is there a written protocol plus probes, and room to deviate (semi-structured)?", "Is the interview triangulated with another method (don’t rely on one technique)?"], "limits": [{"text": "Memory / self-report: “do people remember incidents from weeks ago?”; self-report ≠ actual behaviour – ethnography studies what people do, not what they say they do (2-1 p4).", "ref": "2-1 p2"}, {"text": "People don’t know what they want or what’s possible, can’t explain what’s inadequate; asked about a feature they (almost) always say yes.", "ref": "2-1 p3"}, {"text": "Courtesy bias (overly positive answers to avoid offending interviewer/sponsor) and social desirability bias (withhold what looks bad, exaggerate what looks good).", "ref": "2-2 p20"}, {"text": "Interviewer-introduced bias: leading, loaded, compound questions and small hints produce bad data – watch for introduced biases, don’t rely on one technique.", "ref": "2-2 p28"}, {"text": "Small scale (~10 people), time-consuming; low response rates → incentives (which risk undue influence, 1-2 p12).", "ref": "2-2 p11"}], "examples": [{"text": "Information seeking in the social sciences protocol: ‘Think back to the last time you were writing a research paper and you needed a reference. Can you talk me through what you needed, and what you did to find it?’ + follow-ups on search/browse strategies.", "ref": "2-2 p25"}, {"text": "Probes: ‘do you use the university library system, SoSciCite, a subject-specific web resource…’; if Google Scholar is mentioned, add it to the next interview’s probes.", "ref": "2-2 p26"}, {"text": "Ask them to be the expert: ‘You clearly do a lot of searching for photographs of ancestors – what advice would you give to a beginner?’", "ref": "2-2 p24"}, {"text": "Compound/emotive poll question (Trump statements): is the respondent agreeing with some parts, all parts, or the fact he said them?", "ref": "2-2 p22"}], "quotes": [{"text": "The shorter the interviewer's questions and the longer the answers, the better", "ref": "2-2 p14"}, {"text": "This is “bad science” because it leads to bad data", "ref": "2-2 p19"}, {"text": "Watch for introduced biases: don’t rely on one technique", "ref": "2-2 p28"}], "related": ["observations", "questionnaires", "diary-studies", "ethics", "requirements", "personas", "user-testing"], "keySlides": ["2-2 p10", "2-2 p11", "2-2 p19"]}, {"id": "questionnaires", "name": "Questionnaires & Surveys", "group": "technique", "lecture": "2-2", "aliases": ["questionnaire", "questionaire", "survey", "surveys", "online survey", "QR code survey", "Likert", "closed questions", "fixed responses", "response rate", "ask people"], "summary": "An ‘ask people’ method: fixed questions sent to participants (email, txt, paper). Suits >10 people and people at a distance; but low response rates and limited data from fixed responses, with no chance to follow up.", "points": [{"text": "One of the ‘Ask people’ UX methods alongside interviews and surveys.", "ref": "2-2 p10"}, {"text": "Use for > 10 people; sent via email, txt, paper; good for people at a distance (saves cost & time).", "ref": "2-2 p11"}, {"text": "Low response rates – face-to-face interview rates are better; low rates → incentives.", "ref": "2-2 p11"}, {"text": "Limited data from fixed responses; costs similar to interviews because constructing a good questionnaire takes time.", "ref": "2-2 p11"}, {"text": "Closed questions belong in questionnaires/surveys rather than interviews.", "ref": "2-2 p18"}, {"text": "No follow-up: ability to follow up answers is “not possible in a static survey or questionnaire”. Avoid leading/loaded/complex/compound items (‘Cars should be faster and safer’).", "ref": "2-2 p21"}, {"text": "Can run longitudinally: Mass-Observation’s National Panel replied to regular open-ended questionnaires; Flutracking’s weekly email-prompted survey (3-1 p5).", "ref": "3-1 p4"}, {"text": "Feeds personas/empathy maps: interviews, surveys, observations of real people → persona ‘stereotypes’ (5-2 p32); questionnaire responses can fill the ‘Says’ quadrant.", "ref": "5-2 p47"}], "apply": ["Is the population large/distant enough (>10, remote) to justify a questionnaire over interviews?", "Is every item single-concept, neutral, non-leading and in users’ terms?", "How will you get an adequate response rate (short, prompt right after the event – e.g. QR code on a self-checkout receipt) without incentives becoming undue influence?", "Do fixed responses capture enough? Add an open ‘why’ item or a follow-up interview.", "Are categories culturally safe (country lists, names, genders) for an international audience?"], "limits": [{"text": "Low response rates.", "ref": "2-2 p11"}, {"text": "Limited data from fixed responses; cannot follow up or probe.", "ref": "2-2 p21"}, {"text": "Self-report problems: people don’t know what they want or what’s possible; recall of past incidents.", "ref": "2-1 p3"}, {"text": "Wording bias: emotive language and multiple concepts make answers uninterpretable.", "ref": "2-2 p22"}, {"text": "Building a good questionnaire takes time – not actually cheaper than interviews.", "ref": "2-2 p11"}], "examples": [{"text": "Flutracking: email prompts for weekly survey; 110,000+ participants per week, 18.2M surveys (Australia 16 yrs, NZ 4 yrs).", "ref": "3-1 p5"}, {"text": "Marriott online customer survey listed Tibet, Taiwan, Hong Kong and Macau as countries → China shut its Chinese websites for a week.", "ref": "11-2 p9"}, {"text": "Compound/emotive Trump poll question – respondent’s (dis)agreement is ambiguous.", "ref": "2-2 p22"}], "quotes": [{"text": "Ability to follow up answers – not possible in a static survey or questionnaire", "ref": "2-2 p21"}], "related": ["interviews", "diary-studies", "observations", "personas", "internationalisation", "ethics"], "keySlides": ["2-2 p11", "2-2 p22"]}, {"id": "diary-studies", "name": "Diary Studies", "group": "technique", "lecture": "3-1", "aliases": ["diary study", "diary", "diaries", "journal", "journaling", "experience sampling", "ESM", "EMA", "ecological momentary assessment", "event-contingent", "interval-contingent", "time-contingent", "signal-contingent", "photo diary", "audio diary", "mobile diary", "txt 4 l8r", "Phase I diary"], "summary": "Participants observe and record their own activities/events over time (date, time, location, what happened, feelings). Gives in-context, everyday data with a short delay between event and record; sits between naturalistic observation and lab studies.", "points": [{"text": "Engage the observed to do the observing: participants have full access to themselves over extended periods; they record, the UX designer analyses/interprets (often with them). Sits between naturalistic observation (‘in the wild’) and lab studies (isolated from context).", "ref": "3-1 p6"}, {"text": "Method: record date & time, location, information about the event, feelings/subjective impressions. Key advantage: short time between event and recording → less memory lapse or retrospective re-interpretation.", "ref": "3-1 p7"}, {"text": "Formats: paper (easy, no tech; handwriting hard to read/transcribe; use small, portable notepads); digital: SMS, custom app, web; audio, photo, video. Free-form v structured templates; pre-set categories minimise entry cost (3-1 p10, p11).", "ref": "3-1 p8"}, {"text": "Photo diaries give less info than expected, quality issues, awkward in public – best as memory cues with captions or in interviews. Audio: no writing but needs transcribing; people won’t review own voice. SMS/social posts: brief, auto-timestamped (3-1 p15).", "ref": "3-1 p14"}, {"text": "Mobile diary app: image/video, structured, time-stamped, always carried, socially acceptable, push reminders. But app download loses recruits – over-recruit by 100%; most dropout before first entry, next after 1–2 entries.", "ref": "3-1 p16"}, {"text": "Experience Sampling (ESM/EMA) types: event-contingent (record when X happens – most diaries; good for rare events, low memory reliance; bad: must remember to record, very frequent events get missed).", "ref": "3-1 p20"}, {"text": "Interval/time-contingent (every N minutes, e.g. 8pm daily): good for frequent events, time-series, predictable; bad: participants adapt responses, needs retrospection, poor for memory-biased topics (emotions).", "ref": "3-1 p21"}, {"text": "Signal-contingent (researcher signals at unpredictable times, e.g. txt; or sensors – GPS, activity, app use): ‘at the moment’ reports, better for memory-biased topics; bad: interrupts participants whatever they’re doing.", "ref": "3-1 p22"}, {"text": "Post-study: daily slot to estimate unrecorded events; contact participants after a few days and work through entries (reminder + spot problems); debrief interview talking through sample entries for deeper meaning.", "ref": "3-1 p28"}], "apply": ["Does the contingency fit event frequency? Rare → event-contingent; frequent → interval; memory-biased (emotions) → signal.", "Is entry cost minimal (structured template, tick-box categories, phone-based) so people keep going?", "How are dropout and tail-off handled (over-recruit, mid-study check-in, reminders, ≤ ~2 weeks)?", "Is there a post-study debrief interview to recover context and meaning?", "Self-checkout alternative: shoppers log each self-checkout use on their phone (event-contingent) – problem, location, feeling – then debrief; avoids interrupting them in-store and courtesy bias, but they may omit/forget events.", "Privacy: what will participants leave out, and is the data stored/anonymised ethically?"], "limits": [{"text": "Effortful and not fun → hard to recruit, high drop-out, tail-off (many detailed early entries, few brief later ones); ~2 weeks practical upper length, yet long periods needed to capture usual + unusual events.", "ref": "3-1 p18"}, {"text": "Diary-keeping interferes with the task → entries often made retrospectively, without the designer knowing.", "ref": "3-1 p18"}, {"text": "Privacy: participants omit details/events (would you report everything you searched for?) – “do people report everything?”", "ref": "2-2 p10"}, {"text": "Format costs: photos low-info/awkward; audio needs transcription; app download loses recruits.", "ref": "3-1 p15"}, {"text": "Phase I diary was simplified: short, no technology, no reminders, no explicit post-activity interview.", "ref": "3-1 p31"}], "examples": [{"text": "Hinze, Chang & Nichols (2010) mobile information needs: 12 people, 1 week, 220 entries (avg 18); 78% of queries prompted by participant’s situation; 20% mention other people/places.", "ref": "3-1 p12"}, {"text": "Music encounters diary template: Time | Your location | Description of event | Comments (do you like the music?).", "ref": "3-1 p11"}, {"text": "Activity log filled every half hour; researcher assigns categories in end-of-day debrief (minimal entry cost).", "ref": "3-1 p10"}, {"text": "txt 4 l8r (Brandt et al. 2007): in-situ snippets via SMS/MMS, completed into structured entries later on a website; people avoided audio (felt awkward).", "ref": "3-1 p27"}, {"text": "Phase I: record money + technology activities for ≥3 days using the Moodle template; 2-page analysis.", "ref": "3-1 p30"}], "quotes": [{"text": "Short time between event occurrence and recording → less subject to memory lapse or retrospective re-interpretation of event", "ref": "3-1 p7"}, {"text": "As a general rule, over-recruit by 100% – get twice the promises of participation that you need.", "ref": "3-1 p16"}, {"text": "Two weeks is about the practical upper length for most diary studies", "ref": "3-1 p18"}], "related": ["observations", "interviews", "questionnaires", "ethics", "requirements", "personas"], "keySlides": ["3-1 p11", "3-1 p10", "3-1 p19"]}, {"id": "requirements", "name": "Requirements Elicitation", "group": "technique", "lecture": "3-1", "aliases": ["requirements", "requirement", "requirements elicitation", "requirements gathering", "user requirements", "user needs", "needs", "stakeholders", "stakeholder", "changing requirements", "functional requirements", "faster horses", "why not just ask"], "summary": "Working out actual design requirements from stakeholders who often don’t know what they want, speak their own terminology, disagree and have hidden motives – so UX elicits needs (not feature wishlists) through several people-centric methods and refines them by prototyping.", "points": [{"text": "Stakeholders often don’t know what they really want; express requirements in their own terminology; have different requirements, expressed differently; may have other motives (political, strategic, personal); may not know external factors (cost, existing plans, legal, security, environmental).", "ref": "3-1 p2"}, {"text": "Why not just ask: people don’t know what they want or what’s possible; know something is inadequate but lack a framework to explain; can’t advise on how (standalone app? layout?); asked if they want a feature → (almost) always yes. Find needs in more than one way.", "ref": "2-1 p3"}, {"text": "Methods: ask people (interviews, questionnaires, surveys); observe; digital records (server logs, search queries); documentation (help desk, FAQs, training material); ask participants to do activities (diary studies); co-design.", "ref": "2-1 p2"}, {"text": "Elicit needs, not features: avoid ‘what features do you want and what should the interface look like?’ – instead elicit a need a feature could address, or identify a problem/error in the current system.", "ref": "2-2 p19"}, {"text": "From records/artefacts/environment: keep the positive aspects of current records/tools, eliminate the negative ones in the new system.", "ref": "2-1 p27"}, {"text": "Paper prototypes as a requirements technique: each iteration generates requirements; with real users they uncover more accurate requirements; record specifications.", "ref": "4-1 p22"}, {"text": "Scenarios v “long-winded and impossible-to-read functional requirement specifications” – scenarios say WHY, WHAT and HOW users need the design (Goodwin).", "ref": "5-1 p16"}, {"text": "Constraints are requirements too: legal requirements (e.g. provision for visually impaired users); be explicit about technology requirements and user capabilities needed to use the system.", "ref": "11-1 p20"}, {"text": "Learning outcome: elicit user requirements and use them to develop prototype designs. Real-world UX has more changing requirements during a project (12-1 p5).", "ref": "12-1 p4"}], "apply": ["Is each requirement traceable to user data (diary, interview, observation) rather than designer preference?", "Is it framed as a user need/problem rather than a requested feature?", "Were all stakeholder groups consulted, and conflicting motives surfaced?", "Are constraints captured – legal, accessibility, technology, cost?", "Were requirements validated and refined through prototype iterations with real users?"], "limits": [{"text": "Stakeholders conflict and have hidden motives – “Somehow, we have to work through all of this”.", "ref": "3-1 p2"}, {"text": "Every elicitation method has limitations – combine methods.", "ref": "2-2 p10"}, {"text": "Requirements change during real projects.", "ref": "12-1 p5"}], "examples": [{"text": "Party observations → requirements: no fine motor movements, large readable display, physically robust.", "ref": "2-1 p11"}, {"text": "Party collection from different donors/media → requirement to merge into a single browsable/searchable collection.", "ref": "2-1 p12"}, {"text": "F16 pilot’s unmet need: a moving map – met by a cheap iPAQ app, not the mil-spec system.", "ref": "2-2 p7"}], "quotes": [{"text": "Somehow, we have to work through all of this to produce actual design requirements", "ref": "3-1 p2"}, {"text": "“If I had asked people what they wanted, they would have said faster horses.”", "ref": "12-1 p21"}], "related": ["interviews", "observations", "diary-studies", "questionnaires", "scenarios", "personas", "paper-prototyping", "ux-process"], "keySlides": ["3-1 p2", "2-1 p3"]}, {"id": "sketching", "name": "Sketching & Storyboarding", "group": "technique", "lecture": "4-1", "aliases": ["sketch", "sketches", "sketching", "storyboard", "storyboarding", "story board", "interface sketch", "wireframe", "wireframing", "lo-fi sketch", "user flow", "sketch the flow", "KISS"], "summary": "A sketch is ‘a visualisation of your thoughts’: quick, cheap, disposable drawings for sharing and exploring design ideas before committing. Storyboards of the task come before interface sketches.", "points": [{"text": "Sketching and prototyping should be: Quick, Timely, Plentiful, Inexpensive, Disposable.", "ref": "4-1 p7"}, {"text": "A sketch has: clear vocabulary, distinct gesture, minimal detail, appropriate degree of refinement, ambiguity. It should ‘suggest and explore, rather than confirm’.", "ref": "4-1 p10"}, {"text": "Fidelity ladder (low→high): in your mind → text → sketches → paper prototypes (Phase II) → digital prototypes (Phase III) → video.", "ref": "4-1 p6"}, {"text": "Storyboards come first: ‘we sketch storyboards BEFORE we sketch interfaces’.", "ref": "4-1 p13"}, {"text": "Storyboard step 1: outline the frames. 5 boxes are often enough to illustrate/narrate one scenario. Hand-rendered is fine.", "ref": "4-1 p14"}, {"text": "Steps 2–4: develop the storyline (establishing shot → story develops → climax → conclusion), sketch the story K.I.S.S., emphasise actions and motions.", "ref": "4-1 p15"}, {"text": "Interface artefacts in increasing fidelity: sketch → wireframe → mockup → prototype.", "ref": "4-1 p19"}, {"text": "Interface sketch don’ts: don’t draw every screen, only the important ones (what is its purpose? how does it help the user reach their goal?). Don’t start with wireframing tools, because the lo-fi phase lets you quickly generate and compare ideas. Don’t add too much detail at first.", "ref": "4-1 p20"}, {"text": "Sketch the flow between screens (user flow / journey), not just single screens. Lecture summary: sketching is a ‘technique for sharing design ideas’.", "ref": "4-1 p45"}], "apply": ["Were several alternative ideas sketched and compared before one was picked (plentiful, disposable)?", "Was a storyboard of the persona’s scenario made before the screens were drawn?", "Is the level of detail right: enough to communicate, rough enough to invite change (explore, not confirm)?", "Were only the key screens sketched, each with a clear purpose tied to the user’s goal?", "Does a flow sketch show how the screens connect for the main task?"], "limits": [{"text": "Minimal detail means fine visual design can’t be judged (colour, fonts, target size, response time). This limit is shared with paper prototypes.", "ref": "4-1 p44"}, {"text": "Polished drawings get treated as ‘set in stone’, so clients won’t suggest radical changes. Architects’ CAD tools render designs as sketches for this reason.", "ref": "4-1 p42"}, {"text": "Jumping straight to wireframing tools or adding detail too early cuts down idea generation.", "ref": "4-1 p20"}], "examples": [{"text": "Storyboard narrative: establishing shot → development → climax → conclusion.", "ref": "4-1 p15"}], "quotes": [{"text": "A visualisation of your thoughts", "ref": "4-1 p8"}, {"text": "Suggest and explore, rather than confirm", "ref": "4-1 p10"}, {"text": "Thus, we sketch storyboards BEFORE we sketch interfaces", "ref": "4-1 p13"}], "related": ["paper-prototyping", "scenarios", "digital-prototyping", "ux-process"], "keySlides": ["4-1 p9", "4-1 p13", "4-1 p19"]}, {"id": "paper-prototyping", "name": "Paper Prototyping", "group": "technique", "lecture": "4-1", "aliases": ["paper prototype", "paper prototypes", "paper prototyping", "lo-fi prototype", "low fidelity", "low-fi", "lofi", "paper demo", "Phase II prototype", "the computer", "human computer role", "paper mockup"], "summary": "A low-fidelity, hand-drawn interface with movable pieces. One person plays ‘the computer’ while a user attempts tasks. It is used for early usability testing, to ‘find out if you’re on the right track before writing any code’.", "points": [{"text": "Prototyping is ‘externalizing and making concrete a design idea for the purpose of evaluation’ (Bill Verplank).", "ref": "4-1 p4"}, {"text": "Why prototype (especially on paper): cheaper, less accurate renditions of the interface; feedback earlier, when it’s cheaper; alternatives are easy to change or discard; technology variables are removed from testing.", "ref": "4-1 p5"}, {"text": "Useful as (1) a communication tool between designers and clients, (2) a way to define requirements, since each iteration generates more accurate ones from real users, and (3) a way to develop and record specifications. A ‘working’ model is easier to read than formal specs.", "ref": "4-1 p22"}, {"text": "A test can reveal: the conceptual model (do users understand it?), functionality (does it do what’s needed? missing features?), navigation and task flow (can users find their way? missing paths?), and terminology (are the labels understood?).", "ref": "4-1 p23"}, {"text": "Procedure: one person is the ‘computer’ and does exactly what the system would (user touches File, computer puts down the File menu sticky). At least one person notes problems, hesitancies and errors. It’s OK to change the prototype on the fly. Afterwards, evaluate notes → improve → build and test a new prototype. Repeat until the major defects are gone.", "ref": "4-1 p28"}, {"text": "Resist making it look ‘nice’ (no rulers or perfect right angles). If it’s hard to create, it is unlikely to be amended and looks harder to change. ‘That is the point: an easily changed prototype’.", "ref": "4-1 p25"}, {"text": "Build tips: ONE window/screen per sheet; larger than life (fingers > mouse pointers); readable, big, high contrast; ignore colour because it distracts from broader issues. Tools: blank paper, re-stickable adhesive, correction tape, post-its, photocopier, scissors.", "ref": "4-1 p36"}, {"text": "Say subtle feedback out loud (‘a progress bar pops up: 20%, 50%, 75%, done!’). Keep pieces organised in folders or envelopes.", "ref": "4-1 p37"}, {"text": "Why paper, not code: faster and cheaper; keeps focus on big issues (task ordering, functionality) rather than icon size or colour; avoids implementing bad designs; manages risk with early, regular usability testing. There is less emotional investment, so it is easier to discard. Non-technical team members can take part.", "ref": "4-1 p42"}], "apply": ["Which of the four learnings (conceptual model, functionality, navigation/task flow, terminology) did your test actually surface? Give one finding for each.", "Was the ‘computer’ purely reactive, never instructing or leading the user?", "Was it rough enough that testers felt free to criticise it, and did you change it between or during tests?", "What could paper NOT test (target size and spacing per Fitts, colour, response time, hover) that needs the digital prototype?", "Was it scoped to the key scenario screens rather than the whole system?"], "limits": [{"text": "Crude: can’t evaluate fine design detail such as colour, fonts, whitespace, animation, hover feedback or response times.", "ref": "4-1 p44"}, {"text": "Some ‘feel’ issues are missed, e.g. buttons that are too small or too close together won’t be detected.", "ref": "4-1 p44"}, {"text": "The ‘computer’ must know the intended functionality fully. Not suited to extremely complex apps with many screens (demo one portion at a time).", "ref": "4-1 p44"}, {"text": "Risk that the walkthrough leads the users.", "ref": "4-1 p44"}, {"text": "Exploration vs deliberation: users are more deliberate with paper and don’t explore (or thrash).", "ref": "4-1 p44"}], "examples": [{"text": "Word processor paper demo: user touches File → computer puts down the File menu sticky → Open → large sticky with the Open dialog.", "ref": "4-1 p28"}], "quotes": [{"text": "And that is the point: an easily changed prototype", "ref": "4-1 p25"}, {"text": "Find out if you’re on the right track before writing any code", "ref": "4-1 p45"}, {"text": "We've seen teams completely redesign their products, literally overnight, after learning that their current design was headed for disaster.", "ref": "4-1 p43"}], "related": ["sketching", "user-testing", "digital-prototyping", "scenarios", "requirements", "fitts"], "keySlides": ["4-1 p24", "4-1 p6"]}, {"id": "user-testing", "name": "User Testing (Usability Testing of Prototypes)", "group": "technique", "lecture": "4-1", "aliases": ["usability testing", "usability test", "user study", "user studies", "think aloud", "think-aloud", "thinking aloud", "prototype testing", "test with people", "facilitator", "observer", "pilot test", "evaluation with users", "testing roles"], "summary": "Evaluating a prototype by having representative users attempt realistic tasks (from scenarios) while thinking aloud. Team members play computer, facilitator and observer, record problems, then redesign and retest.", "points": [{"text": "Ideal roles. Computer: simulates the prototype and gives no feedback the software wouldn’t. User: a prospective user or client, not someone on the design team. Facilitator: presents the interface and tasks, keeps the user on track, prompts think-aloud. Observer: ‘keeps mouth shut’, never offers help, takes many notes. In the real world there are never enough people, resources or time.", "ref": "4-1 p29"}, {"text": "Minimum (Phase II): User + Computer/Facilitator. Combining these roles is difficult. Jot notes briefly and write up in full ASAP after the test. Best suited to pilot testing of first drafts. You may buddy up as note-taker for another student.", "ref": "4-1 p30"}, {"text": "Think aloud: the user says out loud what they intend, what they find puzzling and what frustrates them. If they fall silent, the facilitator gently prompts (‘what are you doing now?’). The ‘computer’ simply reacts and does not instruct or lead.", "ref": "4-1 p26"}, {"text": "Explain the study and domain first. Avoid leading participants. Child-study facilitator example of a leading question: ‘sprinkles make it more fun, don’t they?’", "ref": "4-1 p27"}, {"text": "Record problems, hesitancies and errors. After the test: evaluate notes → improve the design → test the new prototype. Repeat until the major defects are worked out.", "ref": "4-1 p28"}, {"text": "Testing digital (med-fi) prototypes works the same as for paper: with users, heuristic evaluation, etc.", "ref": "8-1 p20"}, {"text": "Phase III evaluation is a user study. In general you can add heuristics, developer guidelines, design principles and perspectives (ethics, accessibility, i18n).", "ref": "8-1 p36"}, {"text": "Place in the process: task-centred walkthrough → heuristic evaluation → usability testing and redesign → limited field testing → alpha/beta.", "ref": "8-1 p4"}, {"text": "Ethics: keep participant data confidential; code participants (P1, P2), with no names or initials; avoid quotes that could identify them. Confidentiality is part of the project marking.", "ref": "1-2 p15"}, {"text": "Number of users: the lecture gives no figure. Nielsen’s guideline is that about 5 users per round finds most problems, so run several small rounds rather than one big one.", "ref": "general"}], "apply": ["Were participants representative of the target users/persona, not team members or CS friends? (‘UX students ≠ CS students ≠ normal people’, 12-1 p3)", "Were tasks drawn from scenarios and given as goals, not step-by-step instructions?", "Did the facilitator avoid leading or hinting? Were any hints logged?", "Was think-aloud prompted, and were notes captured during the session and written up immediately after?", "Were participants tested separately, so one didn’t learn from watching the other?", "Does each finding map to a redesign change, and was the refined design retested?"], "limits": [{"text": "Facilitator bias and leading questions skew results.", "ref": "4-1 p27"}, {"text": "Combining the computer and facilitator roles is hard, so notes are taken retroactively and details get lost.", "ref": "4-1 p30"}, {"text": "Med-fi tests get reactions ‘in the small’ that blind people to major representational flaws. Users are reluctant to challenge ‘pretty’ designs.", "ref": "8-1 p20"}, {"text": "Paper tests: users are more deliberate and don’t explore.", "ref": "4-1 p44"}, {"text": "Course process is simplified. Real UX has more rounds of redesign and re-evaluation, and more diverse participants.", "ref": "12-1 p5"}], "examples": [{"text": "Child user study: the facilitator has to be more active, but asks leading questions.", "ref": "4-1 p27"}, {"text": "First-click testing: a correct first click gives an 87% chance of completing the task, vs 46% if the first click is wrong.", "ref": "10-2 p27"}], "quotes": [{"text": "Keeps mouth shut - this is harder than it sounds!", "ref": "4-1 p29"}, {"text": "avoid leading participants", "ref": "4-1 p27"}], "related": ["paper-prototyping", "digital-prototyping", "nielsen-heuristics", "observations", "ethics", "scenarios", "wizard-of-oz", "user-diversity"], "keySlides": ["8-1 p4"]}, {"id": "nielsen-heuristics", "name": "Nielsen’s 10 Usability Heuristics", "group": "technique", "lecture": "4-2", "aliases": ["heuristics", "heuristic evaluation", "Nielsen", "Nielson", "Neilsen", "Jakob Nielsen", "10 heuristics", "ten heuristics", "usability heuristics", "rules of thumb", "HE", "visibility of system status", "match real world", "user control and freedom", "consistency and standards", "recognition rather than recall", "flexibility and efficiency", "aesthetic and minimalist", "help and documentation", "recover from errors"], "summary": "Nielsen’s 10 usability heuristics: informal, general ‘rules of thumb’. They are the oldest set and the one used in COMPX324. They help designers choose between design alternatives or find problems in an interface (‘heuristic evaluation’).", "points": [{"text": "Heuristic = a practical method ‘not guaranteed to be optimal or perfect, but sufficient for the immediate goals’. Other sets: Tognazzini’s 16, Shneiderman’s 8 Golden Rules, Norman’s rules. Related: platform guidelines (Apple HIG, Material, Fluent, GNOME).", "ref": "4-2 p4"}, {"text": "H1 Visibility of system status: always keep users informed about what is going on, through appropriate feedback within reasonable time. Examples: progress bars (‘step 1 of 3’), hourglass, breadcrumbs, confirmation messages. Good: Heathrow connection signage, Kickstarter new-project steps.", "ref": "4-2 p8"}, {"text": "H1 response-time guide: <0.1 s seems instantaneous; 0.1–1 s user notices but no feedback needed; 1–5 s show a busy cursor; >1–5 s show a progress bar. ‘But don’t overdo the feedback’.", "ref": "4-2 p9"}, {"text": "H2 Match between system and the real world: speak the users’ language (familiar words and concepts, not system-oriented terms); follow real-world conventions; present information in a natural and logical order; often uses metaphor (don’t overdo it or switch metaphors). Examples: `ls -h` human-readable sizes; months listed alphabetically; ordinal IE security levels sorted alphabetically; unordered NEXT jeans sizes.", "ref": "4-2 p11"}, {"text": "H3 User control and freedom: users often pick functions by mistake and need a clearly marked ‘emergency exit’ without an extended dialogue. Support undo and redo. Good: CollabFinder search is easy to leave. Use explicit buttons (‘Cancel printing’), not ‘this’ or ‘it’.", "ref": "4-2 p18"}, {"text": "H4 Consistency and standards: users should not have to wonder whether different words, situations or actions mean the same thing. Follow platform conventions. Bad: radio button ‘Set Security Off ○ On ○ Off’; Dell Vostro keyboard; Waikato signage (Dept/School/Faculty). Good: Office apps share the Home/Insert/Page Layout ribbon. Consistency usually brings efficiency and perceived intuitiveness.", "ref": "4-2 p21"}, {"text": "H5 Error prevention: ‘even better than good error messages’. Either eliminate error-prone conditions or check for them and ask for confirmation before commit. Examples: marking mandatory fields, form validation, clear checkout instructions, ‘Are you sure?’, clear labels. Autofocus on an input prevents typing into nothing, but use it carefully.", "ref": "4-2 p27"}, {"text": "H6 Recognition rather than recall: minimise memory load by making objects, actions and options visible. Users shouldn’t have to remember info from one part of the dialogue to another, and instructions should be visible or retrievable. Examples: a map on the room-booking page, a drop-down of options, ‘Did you mean…’, tool-tips, font menus that preview each font.", "ref": "4-2 p29"}, {"text": "H7 Flexibility and efficiency of use: accelerators, unseen by novices, speed up experts so the system caters to both. Let users tailor frequent actions. Examples: quick-links, hotkeys, saved searches, ‘items you recently looked at’, ‘save query for later’.", "ref": "4-2 p31"}, {"text": "H8 Aesthetic and minimalist design: dialogues shouldn’t contain irrelevant or rarely needed info, because every extra unit competes with the relevant ones and diminishes their relative visibility. Examples: reduce clutter, clear calls to action, no annoying flashing eye-candy.", "ref": "4-2 p32"}, {"text": "H9 Help users recognise, diagnose and recover from errors: error messages in plain language (no codes) that precisely indicate the problem and constructively suggest a solution. Bad: ‘Recover by closing your Window Manager and your File Manager?’", "ref": "4-2 p33"}, {"text": "H10 Help and documentation: better if the system can be used without it, but help should be easy to search, focused on the user’s task, list concrete steps and not be too large. Examples: FAQs, ‘?’ icons, pop-up help, live chat. Good: Mac Word Help search highlights the menu item.", "ref": "4-2 p35"}, {"text": "Summary: heuristics are informal guides, very general (apply to anything), usable in different development phases, the collected wisdom of previous designers, ‘not always right, but a generally good start to evaluation’. Heuristic evaluation is a common UX job requirement (4-2 p3) and sits at ‘heuristic evaluation and redesign’ with medium-fi prototypes (8-1 p4).", "ref": "4-2 p39"}, {"text": "Running a heuristic evaluation (the lecture links Nielsen’s ‘How to conduct a heuristic evaluation’ at 4-2 p38; details are general): 3–5 evaluators inspect independently, with 2 passes (flow, then each element). Log each problem with the heuristic violated and its location, then merge. Severity 0 = not a problem, 1 = cosmetic, 2 = minor, 3 = major, 4 = catastrophe. Severity is judged on frequency × impact × persistence.", "ref": "general"}], "apply": ["Own-error question: name the heuristic(s) the design violated (usually H5 prevention, H9 recovery, H1 status, H3 undo/exit), quote the definition, then show the redesign that satisfies it.", "Walk every screen of your prototype against all 10. Record violation + heuristic + location + severity (0–4).", "Does every action give feedback scaled to its response time (instant / busy cursor / progress bar)?", "Are labels in the user’s words, not the system’s (e.g. ‘Target date’ instead of ‘Save by’)?", "Is there undo or a clearly marked exit for every mistaken or destructive action?", "Do accelerators for experts (H7) add clutter for novices (H8)? How is the conflict resolved?"], "limits": [{"text": "Informal and ‘not always right’. Very general, so applying them needs interpretation and evaluators can disagree.", "ref": "4-2 p39"}, {"text": "Heuristics are abstract. They don’t give element-level rules the way UI guidelines do.", "ref": "4-2 p5"}, {"text": "Heuristics can conflict or be overdone: feedback ‘don’t overdo’ (4-2 p9); autofocus ‘use carefully’ (4-2 p28); accelerators (H7) vs minimalism (H8).", "ref": "4-2 p9"}, {"text": "An inspection by designers isn’t real users. Combine it with a user study (the Phase III approach).", "ref": "8-1 p36"}, {"text": "A single evaluator finds only a fraction of the problems, so aggregate several evaluators.", "ref": "general"}], "examples": [{"text": "H2: `ls -h` prints 13M instead of 13569732, the user’s units rather than the system’s.", "ref": "4-2 p13"}, {"text": "H4: radio button ‘Set Security Off ○ On ○ Off’, which leaves users unsure what On means.", "ref": "4-2 p21"}, {"text": "H9: ‘Recover by closing your Window Manager and your File Manager?’", "ref": "4-2 p34"}], "quotes": [{"text": "Even better than good error messages is a careful design which prevents a problem from occurring in the first place.", "ref": "4-2 p27"}, {"text": "Every extra unit of information in a dialogue competes with the relevant units of information and diminishes their relative visibility.", "ref": "4-2 p32"}, {"text": "Not always right, but a generally good start to evaluation", "ref": "4-2 p39"}], "related": ["error-prevention", "error-types", "forcing-functions", "platform-guidelines", "user-testing", "frequency", "recency", "data-ink"], "keySlides": ["4-2 p7", "4-2 p14", "4-2 p36"]}, {"id": "platform-guidelines", "name": "Platform / UI Guidelines", "group": "technique", "lecture": "4-2", "aliases": ["platform guidelines", "UI guidelines", "HIG", "Human Interface Guidelines", "Apple HIG", "Material Design", "Material 3", "Google Material", "Fluent", "GNOME HIG", "developer guidelines", "design system", "style guide", "platform conventions", "WCAG", "checklists"], "summary": "Vendor and platform design guidelines (Apple Human Interface Guidelines, Google Material Design, Microsoft Fluent, GNOME HIG). They are concrete, element-level rules, related to heuristics but more specific, and are used to design and to evaluate (as a checklist).", "points": [{"text": "Listed as related to heuristics: Human Interface Guidelines (Apple), Material Design (Google), Fluent (MS), HIG (GNOME).", "ref": "4-2 p4"}, {"text": "UI guidelines are usually based around specific UI elements (e.g. the GNOME and Fluent checkbox usage pages). Heuristic principles are usually more abstract.", "ref": "4-2 p5"}, {"text": "Following guidelines is how you satisfy Nielsen’s H4 Consistency and standards: ‘Follow platform conventions’.", "ref": "4-2 p21"}, {"text": "Apple HIG (Buttons → Best practices): make targets clearly separable from other targets. Consider context of use (moving…), user characteristics (older users, children…) and technology (fingers, mouse…). This links to Fitts’ Law.", "ref": "6-1 p19"}, {"text": "Apple HIG (Lists and tables): an info / detail-disclosure button doesn’t support navigation. To let people drill into a row, use a disclosure indicator (chevron).", "ref": "9-1 p30"}, {"text": "Material Design floating action button (example: Wise Android app), which puts the primary frequent action in a fixed, reachable spot.", "ref": "6-2 p17"}, {"text": "Material Design bidirectionality guidance for LTR/RTL layouts (internationalisation).", "ref": "11-2 p27"}, {"text": "Accessibility: use existing guidelines (W3C Web Accessibility Guidelines) plus the available testing tools.", "ref": "11-1 p14"}, {"text": "As an evaluation approach: ‘Checklists, Developer Guidelines (e.g. Apple Human Interface Guidelines)’ alongside heuristics and design principles (8-1 p36). The 12-1 summary lists ‘UI Guidelines, e.g. Material Design’ among evaluation approaches.", "ref": "12-1 p6"}], "apply": ["Which platform is the prototype for (iOS / Android / web)? Check each component used against that platform’s guideline page.", "Are touch targets sized and spaced per the guideline (HIG buttons), with clear separation?", "Do navigation patterns follow convention (tab bar, back, chevron disclosure indicators on drill-down rows)?", "Are standard components used as specified (checkbox vs toggle, FAB for the single primary action)?", "Do accessibility (WCAG contrast, labels) and RTL guidance hold?"], "limits": [{"text": "Element-level focus. Guidelines say how a checkbox should behave, not whether the design meets user goals, so combine them with heuristics and user studies.", "ref": "4-2 p5"}, {"text": "Platform-specific: Apple, Google and Microsoft rules differ, so a cross-platform or web design can’t follow all of them. Guidelines also change between versions (e.g. Material 2 → 3).", "ref": "general"}], "examples": [{"text": "GNOME and Fluent checkbox usage pages compared with abstract heuristics.", "ref": "4-2 p5"}, {"text": "Apple HIG buttons: separable targets.", "ref": "6-1 p19"}, {"text": "Apple HIG lists: disclosure indicator vs info button.", "ref": "9-1 p30"}, {"text": "Material FAB in the Wise app.", "ref": "6-2 p17"}], "quotes": [{"text": "Follow platform conventions.", "ref": "4-2 p21"}, {"text": "UI guidelines are usually based around specific UI elements", "ref": "4-2 p5"}, {"text": "Heuristic principles are usually more abstract", "ref": "4-2 p5"}], "related": ["nielsen-heuristics", "fitts", "accessibility", "internationalisation", "digital-prototyping", "frequency"], "keySlides": ["4-2 p5", "6-1 p19", "9-1 p30"]}, {"id": "scenarios", "name": "Scenarios", "group": "technique", "lecture": "5-1", "aliases": ["scenario", "user scenario", "task scenario", "story", "narrative", "scenario anatomy", "5W1H", "use case", "user story", "user journey", "journey map", "customer journey", "tasks"], "summary": "A narrative of a persona accomplishing one of their real-world goals using the system being prototyped, without interface details. ‘Scenario = user + task + context’.", "points": [{"text": "A story of a persona’s activities: the persona accomplishes a goal using the system, but interface details are NOT included (no ‘selecting from a pull-down menu’). Written from the persona’s point of view, including real-world issues (social, political, emotional, attitude, social interactions).", "ref": "5-1 p5"}, {"text": "Task breakdown with 5W1H: who performs it? what inputs are needed? what can go wrong? when and where? task objectives? how is it completed?", "ref": "5-1 p4"}, {"text": "Anatomy: an actor (persona, e.g. Kathy), a motivator, an intention, an action, a resolution.", "ref": "5-1 p12"}, {"text": "Scenarios should be focused on the main persona as ‘hero’; written as a story about a specific incident (not ‘a user should initiate…bi-weekly’); and the set should cover both common tasks and uncommon circumstances.", "ref": "5-1 p11"}, {"text": "Typical contents: user (persona) characteristics; system use (novice = step-by-step, expert = power, frequent = shortcuts, casual = clear instructions); usability goals; functional and non-functional requirements; data; environment; social and organisational context.", "ref": "5-1 p8"}, {"text": "Why: they are the basis for use cases and a test of your understanding (plausible? understandable? cover all expectations?). Reality test: can you write a plausible scenario that uses a proposed new function?", "ref": "5-1 p13"}, {"text": "In design: ask what each scenario suggests for functionality, interaction modes and help. Ensure the system supports the scenarios and contains only what makes sense in terms of a scenario and persona. Alter scenarios as you learn, and watch for new ones.", "ref": "5-1 p14"}, {"text": "Guidelines: don’t over-specify the technology (‘identifies herself’, not ‘enters 4-digit PIN’), leaving room for creative (re)design. Avoid technical language (not ‘Server reports SQL row insertion…’). Check the anatomy.", "ref": "5-1 p20"}, {"text": "Related concepts: User Story (Agile: ‘As a [role], I want [feature] because [reason]’); Use Case (UML: formal, explicit steps, system perspective); User Journey map (all touchpoints: ads, website, product, app…).", "ref": "5-1 p17"}], "apply": ["Reality test: does every prototype feature appear in at least one plausible scenario? Cut features that don’t.", "Does the scenario avoid interface mechanics and over-specified technology?", "Can you find actor, motivator, intention, action and resolution?", "Does the set include an uncommon circumstance as well as the routine task?", "List the design implications the scenario implies, as with Joe’s ATM (brief instructions, fast ID, choice of note denomination).", "Evaluation: use the scenario goals as the test tasks given to participants. Frequency link: identify frequent-use scenarios and get them right (6-2 p41)."], "limits": [{"text": "Only as good as your understanding of users and context. A scenario must be plausible and understandable to others.", "ref": "5-1 p13"}, {"text": "Over-specifying technology or UI steps locks in a design and leaves no room for creative redesign.", "ref": "5-1 p20"}, {"text": "Focusing only on routine tasks misses edge cases. The set needs uncommon circumstances too.", "ref": "5-1 p11"}, {"text": "Narrative and informal: less precise than use cases for engineering.", "ref": "5-1 p17"}], "examples": [{"text": "Joe and the new ATM: he’s late, wants $20s and no receipt, and ‘identifies himself’ (allowing PIN or biometrics). Design implications: brief unambiguous instructions, rapid interaction, fewer presses, ‘savings account’ not ‘051 account’, specify note denomination (5-1 p7).", "ref": "5-1 p6"}, {"text": "Kathy the HR rep must do a special bonus payroll run late on a Thursday before a long weekend, with the accountant away. It is an uncommon circumstance.", "ref": "5-1 p10"}, {"text": "Voice design: scenarios → dialog, tested by a table reading of the conversation.", "ref": "9-1 p44"}], "quotes": [{"text": "Scenario = user + task + context", "ref": "5-1 p20"}, {"text": "A scenario tells us WHY our users need our design, WHAT the users need the design to do, and HOW they need our design to do it.", "ref": "5-1 p16"}], "related": ["personas", "sketching", "paper-prototyping", "user-testing", "requirements", "frequency", "voice"], "keySlides": ["5-1 p6", "5-1 p19"]}, {"id": "personas", "name": "Personas", "group": "technique", "lecture": "5-2", "aliases": ["persona", "primary persona", "secondary persona", "negative persona", "bit part", "archetype", "archetypes", "empathy map", "Alan Cooper", "target users", "target user group", "goals", "elastic user", "self-referential design"], "summary": "A fictional but data-based description of a specific character who represents a target user group, together with that character’s real-world goals. It acts as a focus for design: designers refer to ‘Sarah’, never ‘the user’.", "points": [{"text": "Persona: a description of a particular character (stereotype/archetype) the software will be designed for, together with their goals. Goal: what they want to accomplish in the real world, not ‘to use your software’. Scenario: a story of how the persona performs a task to fulfil a goal. Introduced by Alan Cooper (1998), The Inmates are Running the Asylum (5-2 p10).", "ref": "5-2 p9"}, {"text": "Target users: resist designing for everyone, adding every feature, or targeting ‘university students aged 19 to 24’. Better to choose users who share a specific behaviour, interest or focus rather than demographics.", "ref": "5-2 p5"}, {"text": "In use: never say ‘the user’; refer to the persona by name. Personas become extra team members, which forces thinking about specific users rather than aggregate or average ones. You design ‘for one person’ who represents a group, not ‘one size fits all’.", "ref": "5-2 p13"}, {"text": "There is no average user (‘no one actually has 2.17 children’). Make a proportion of the audience 100% happy rather than everyone 50% happy. Roll-aboard suitcases were designed for flight crews.", "ref": "5-2 p15"}, {"text": "Makes arguments less hypothetical: ‘what if the user wants to tailor the printout?’ is undecidable, but ‘Emily will rarely want to…’ lets you omit the feature from v1.0 with confidence. Evaluate options with ‘Would Sarah like this?’ (5-2 p16).", "ref": "5-2 p17"}, {"text": "Contents: personal profile + photo; role; problems with current solutions; ‘flavouring’ back-story; a quote; goals based on real-world objectives.", "ref": "5-2 p21"}, {"text": "Types: Primary (must be satisfied; more than 1 primary means more than 1 interface). Secondary (mostly satisfied by the primary design; add features only if they don’t disrupt the primary). Negative (explicitly not designed for; heads off ‘but what about Fred…’ arguments). Bit part (interacts with a persona).", "ref": "5-2 p35"}, {"text": "Creating: 1) identify target user segments; 2) conduct or review qualitative studies of real people (interviews, surveys, observations); 3) analyse into ‘stereotypes’. Personas are fictional but based on knowledge, ‘not just assumptions’ (5-2 p50).", "ref": "5-2 p32"}, {"text": "Problems personas and scenarios solve: system-centric thinking, too many choices, developer/user/client misunderstandings, unclear picture of users, the elastic user (software that forces the user to adapt), and self-referential design (designers aren’t representative, 5-2 p41).", "ref": "5-2 p40"}, {"text": "Alternatives: archetypes (an abstract behavioural label with no name or photo) and empathy maps (Says / Thinks / Does / Feels, derived from real data).", "ref": "5-2 p43"}], "apply": ["Is each persona derived from Phase I data (interviews, observations, diaries), or is it just made up?", "Are the goals real-world goals rather than ‘use the app’?", "Can each feature be justified by a persona goal (‘Would Sophie like this?’)? Cut the rest.", "Does the design avoid the elastic user and self-referential design (designing for CS students like the team)?", "Who does the negative persona exclude, and is that exclusion acceptable (accessibility, 11-1 p20)?"], "limits": [{"text": "Can encourage stereotypes (e.g. over-focus on the photo), hide edge cases, and be used in place of studies with real users (‘a way PM uses to avoid research’).", "ref": "5-2 p42"}, {"text": "Personas aren’t ‘politically correct’: they target the stereotypical person in a category, so edge cases need extra personas if they are significant enough.", "ref": "5-2 p20"}, {"text": "Negative personas can quietly exclude groups. ‘Think carefully about any negative personas: who is excluded by your design?’", "ref": "11-1 p20"}, {"text": "AI-generated personas risk bias and discrimination.", "ref": "7-1 p26"}], "examples": [{"text": "Sarah Johnson, a literary tourist and Mark Twain fan. Quote: ‘I could swear that Mark Twain had this same annoying tour guide…’; goals include tracking down spots from his novels.", "ref": "5-2 p12"}, {"text": "Voice UIs: a persona for the user (device and context, e.g. car vs kitchen) plus a system persona for the agent (personality, accent).", "ref": "9-1 p42"}], "quotes": [{"text": "Every time you extend functionality to include another constituency, you put another speed bump of features and controls across every other user’s road.", "ref": "5-2 p14"}, {"text": "There is no such thing as an average user", "ref": "5-2 p14"}], "related": ["scenarios", "interviews", "observations", "diary-studies", "requirements", "user-diversity", "accessibility"], "keySlides": ["5-2 p12", "5-2 p44", "5-2 p46"]}, {"id": "swot", "name": "SWOT Analysis", "group": "technique", "lecture": "12-1", "aliases": ["SWOT", "SWOT analysis", "SWOT table", "strengths weaknesses opportunities threats", "merging designs", "Phase III step 1", "comparing designs"], "summary": "A structured comparison of Strengths and Weaknesses (internal to the design) with Opportunities and Threats (external factors). COMPX324 used it in Phase III Step 1 to assess each member’s Phase II system before merging them into one group design.", "points": [{"text": "Listed under ‘Techniques’ in the course summary (with Paper Prototyping, Scenarios, Personas and Digital Prototyping).", "ref": "12-1 p3"}, {"text": "Strengths and Weaknesses are internal attributes of the design itself (what it does well or poorly). Opportunities and Threats are external factors such as market, technology, regulation and user attitudes.", "ref": "general"}, {"text": "Usually a 2×2 grid. Apply the same four headings to each alternative so they can be compared, then act: keep and build on strengths, fix weaknesses, exploit opportunities, mitigate threats.", "ref": "general"}], "apply": ["When comparing alternatives (Phase II designs, competitor apps), put each one under the same four headings.", "Are the W and T items backed by evidence (testing, user data) or just opinion?", "Can each merged-design decision be traced to a Strength kept or a Weakness/Threat addressed?", "Do the Threats include ethical, privacy and regulatory issues (ethics perspective)?"], "limits": [{"text": "Items are unweighted and unprioritised. A SWOT can become a brainstorm list that doesn’t lead to action.", "ref": "general"}, {"text": "The internal/external line blurs for design concepts (e.g. ‘saturated budgeting market’ is really a weakness of the concept).", "ref": "general"}, {"text": "Not a usability evaluation. Complement it with heuristics or user testing.", "ref": "general"}], "examples": [], "quotes": [], "related": ["personas", "requirements", "ethics", "digital-prototyping", "ux-process"], "keySlides": []}, {"id": "digital-prototyping", "name": "Digital Prototyping (Fidelity, Horizontal vs Vertical)", "group": "technique", "lecture": "8-1", "aliases": ["digital prototype", "digital prototyping", "hi-fi", "high fidelity", "medium fidelity", "med-fi", "mid-fi", "fidelity", "horizontal prototype", "vertical prototype", "Figma", "Axure", "Balsamiq", "proto.io", "Penpot", "Phase III prototype", "Claude Design", "canned responses", "hardcoded"], "summary": "A computer-based, usually medium-fidelity, horizontal prototype. It looks like real software and lets users move around freely, but its functionality is simulated with canned or hard-coded responses. This is what Phase III builds.", "points": [{"text": "Phase III is a horizontal prototype: broad across features but low in functionality. A vertical prototype has full functionality for a few features and is rare. A scenario is the path through both. Prototypes are not full systems. Aim: ‘get an idea of what this design would look like if we built it this way’ (Nielsen 1993).", "ref": "8-1 p3"}, {"text": "Fidelity comparison. Low: rough sketch, little or no functionality; low cost; limited usability testing. Mid (Phase III): detailed look, simulated navigation and functionality; cheaper than hi-fi and detailed enough for usability testing; navigation still somewhat scripted and no full ‘feel’. High: lifelike, some functionality, back end simulated; a ‘living specification’; expensive and slow.", "ref": "8-1 p31"}, {"text": "Process: low-fi paper → task walkthrough → medium-fi with heuristic evaluation and usability testing (+ Wizard of Oz) → high-fi / restricted systems → field tests → alpha/beta.", "ref": "8-1 p4"}, {"text": "How med-fi differs from real software: restricted input (queries from a predefined list); the user can choose any ‘legal’ option and navigate anywhere legal; most functionality is simulated, e.g. limited choices (a font list with only 1 real font) and canned responses (search always returns the same list).", "ref": "8-1 p19"}, {"text": "Purpose: offers a sophisticated but limited scenario to try out and can test subtler design issues. Tested the same way as paper (users, heuristic evaluation).", "ref": "8-1 p20"}, {"text": "Tools: PowerPoint and drawing walkthroughs are deprecated (very thin horizontal, no interaction ‘feel’). Others: website builders (Dreamweaver, Wix, Squarespace, Framer), GUI toolkits (Visual Studio), proto.io, Axure, Balsamiq, ProtoPie, Moqups, Pencil, Penpot, Figma.", "ref": "8-1 p22"}, {"text": "Phase III rules: implement no functionality beyond what the tool offers and code no real algorithms. The environment needn’t match the target platform. Interaction must not be tightly scripted (the user must ‘move around’ naturally). It must look like real software, not a B&W wireframe. Hardwired responses are OK but no real input processing. Make a video OF the prototype, not a video prototype.", "ref": "8-1 p33"}, {"text": "Common approaches: include only some content items (a few products); show only examples of key functionality (browse by one facet); hard-code features (search works for one keyword); use pseudo-content.", "ref": "8-1 p34"}, {"text": "Don’t code. OK: display a window, change an image. Don’t: sorting, searching, processing, algorithms. Prototype code is inefficient, insecure, not scalable, thrown away, and misdirected effort. ‘The hardest thing for a programmer to do is not to code’.", "ref": "8-1 p35"}, {"text": "Evaluating it: a Phase III user study, plus heuristic evaluation, checklists and developer guidelines (Apple HIG), design principles (Fitts, Hick, data-ink, space, error prevention, frequency/recency/redundancy) and perspectives (ethical, accessibility, i18n).", "ref": "8-1 p36"}], "apply": ["Is it horizontal (breadth of key screens), with interaction loose enough for testers to ‘move around’ rather than follow a script?", "What can the higher fidelity now test that paper couldn’t: target size and spacing (Fitts), colour and contrast, real typed values, error messages, scrolling, response feedback?", "Do the canned or hard-coded responses cover the scenario tasks given to testers?", "Did the polish stop testers from challenging the overall design (reactions ‘in the small’)?", "What happens on clicks outside the prototype’s scope (dead clicks), and how did that affect testing?"], "limits": [{"text": "Med-fi reactions are ‘in the small’, which blinds people to major representational flaws. Users are reluctant to challenge or change ‘pretty’ designs, and designers’ egos get involved.", "ref": "8-1 p20"}, {"text": "Navigation is still somewhat scripted and it doesn’t communicate the full ‘feel’ of the final product.", "ref": "8-1 p31"}, {"text": "Software demos can mislead users (‘it looks like the software exists, why can’t it be used now?’). Testing stops when the demo’s edge is reached. More investment makes the design harder to discard.", "ref": "4-1 p43"}, {"text": "AI prototyping tools (Claude Design) depend on the model interpreting inputs correctly. General AI-tool risks: IP, privacy, overreliance, cost.", "ref": "7-1 p26"}], "examples": [{"text": "Search that accepts any query but always returns the same canned list; a word processor with a font menu but only 1 font.", "ref": "8-1 p19"}, {"text": "E-commerce prototype with only a few products, browsable by one facet, and search hard-coded to one keyword.", "ref": "8-1 p34"}], "quotes": [{"text": "The hardest thing for a programmer to do is not to code", "ref": "8-1 p35"}, {"text": "Phase III includes a video of your prototype - not a Video Prototype", "ref": "8-1 p33"}, {"text": "Prototyping is externalizing and making concrete a design idea for the purpose of evaluation", "ref": "8-1 p2"}], "related": ["paper-prototyping", "wizard-of-oz", "user-testing", "nielsen-heuristics", "platform-guidelines", "sketching", "ai-design-tools"], "keySlides": ["8-1 p3", "8-1 p31", "8-1 p4"]}, {"id": "wizard-of-oz", "name": "Wizard of Oz Prototyping", "group": "technique", "lecture": "8-1", "aliases": ["Wizard of Oz", "WoZ", "WOZ", "wizard", "PNAMBC", "man behind the curtain", "Mechanical Turk", "Chess Turk", "human-simulated system", "fake AI"], "summary": "The user thinks they are interacting with a computer, but a hidden human ‘wizard’ produces the system’s responses. It is used early to learn how users react to a novel or ‘intelligent’ system before building it.", "points": [{"text": "The user thinks they are interacting with a computer, but a human ‘wizard’ responds instead of the system.", "ref": "8-1 p15"}, {"text": "Usually done early in design to understand users’ expectations. It lets developers see how users would react to a novel system.", "ref": "8-1 p15"}, {"text": "Good when the prototype needs ‘intelligence’ to be believable enough (e.g. natural language, recognition).", "ref": "8-1 p15"}, {"text": "Also known as a PNAMBC prototype (‘Pay No Attention to the Man Behind the Curtain’; the expansion is general knowledge).", "ref": "8-1 p14"}, {"text": "In the paper-to-software sequence it sits with usability testing at the medium-fidelity stage.", "ref": "8-1 p4"}, {"text": "Pre-dates computers: the Chess Turk (1770s, Baron von Kempelen), a chess ‘automaton’ exposed in 1827 when the hidden operator was seen crawling out. Amazon Mechanical Turk (crowdsourced human work) is named after it.", "ref": "8-1 p16"}, {"text": "Smart gesture recognition example: a human provides the gesture recognition.", "ref": "8-1 p17"}, {"text": "Voice UIs: the suggested prototyping evaluation approach, where a ‘human provides the system voice’.", "ref": "9-1 p45"}, {"text": "Contrast with the paper-prototype ‘computer’: there the user knows a human is moving the pieces. In WoZ the human is hidden, so the interaction feels real.", "ref": "4-1 p28"}], "apply": ["Does the feature depend on AI or recognition that is costly to build? WoZ it first to check that users want it and how they phrase requests.", "Can the wizard respond consistently and fast enough to stay believable (response-time guidance under Nielsen H1)?", "Does the wizard follow a script or rules limited to what the real system could plausibly do?", "Ethics: was the deception approved, and were participants debriefed afterwards?", "Phase III idea: AI spending insights could be WoZ-tested, with a team member writing the ‘AI’ insight live from the participant’s data."], "limits": [{"text": "It involves deception, and ethics requires ‘absence of deception – unless specific permission for a deceptive study’, plus debriefing. 12-1 p6 asks ‘Is there deception?’", "ref": "1-2 p13"}, {"text": "The wizard can outperform any real technology, which sets unrealistic expectations. This is similar to the ‘unobtanium’ risk of video prototypes.", "ref": "8-1 p8"}, {"text": "Labour-intensive. The wizard needs training, and human latency and inconsistency can distort results.", "ref": "general"}], "examples": [{"text": "The Chess Turk (1770s–1827).", "ref": "8-1 p16"}, {"text": "Smart gesture recognition performed by a hidden human.", "ref": "8-1 p17"}, {"text": "A voice assistant prototype with a human speaking as the system.", "ref": "9-1 p45"}], "quotes": [], "related": ["digital-prototyping", "paper-prototyping", "voice", "ai-iui", "ethics", "user-testing"], "keySlides": ["8-1 p15", "8-1 p16"]}, {"id": "ux-process", "name": "UX & the UX Process", "group": "awareness", "lecture": "12-1", "aliases": ["UX process", "what is UX", "user experience", "why UX matters", "designer is not the user", "you are not the user", "UX students ≠ CS students ≠ normal people", "UX students CS students normal people", "self-referential design", "we are abnormal", "build the right thing", "understand explore prototype test iterate build monitor", "user-centred design", "user centered design", "UCD", "iterate", "iteration"], "summary": "UX = a design methodology that puts the end user at the heart of every design decision. It is a process (Understand → Explore → Prototype & Test → Iterate → Build & Monitor), built on the premise that designers/developers are NOT representative of users.", "points": [{"text": "Definition (Squires): UX is a design methodology focused on the end user first and foremost; asks e.g. where should the button go, reachable on mobile, left-handed users, clear/welcoming buttons, colours visible to people with sight issues.", "ref": "1-1 p12"}, {"text": "UX is Process: Understand → Explore → Prototype & Test → Iterate → Build & Monitor.", "ref": "12-1 p21"}, {"text": "Achieving usable designs: understand your users (Phase I), then iterate: while ((time < deadline) & (design < good)) { Idea; Prototype; Evaluate }. Many forms of evaluation, e.g. heuristic evaluation.", "ref": "4-2 p2"}, {"text": "Why do UX: to build the right thing; not waste time/resources building the wrong thing or a poorly performing version of the right thing. ‘Build it right’ v ‘build the right it’ – CS spends lots of time on the first, little on the second.", "ref": "2-2 p6"}, {"text": "Designers ≠ users: developers/designers are not representative of users, have technical not user experience, programmers see the world as ‘code’, ‘data structures’ – “We are abnormal!” So use people-centric techniques.", "ref": "2-2 p8"}, {"text": "“UX students ≠ CS students ≠ normal people” is an examinable awareness item. Even this class is skewed (1-1 p3): of 146 students, 77 BCompSci, 24 BDes, 23 BE(Hons) Software Eng.", "ref": "12-1 p3"}, {"text": "Self-referential design: designers/programmers know what they like; left unchecked it is very easy to end up designing for yourself.", "ref": "5-2 p41"}, {"text": "Skills of UX: understand people’s activities, goals, aspirations and contexts of use; know what technology can do; create solutions that fit people, activities, contexts; evaluate alternatives and iterate. Not the same skills as programming/debugging/DevOps. UX is typically team-based and people-centric.", "ref": "2-2 p4"}, {"text": "Stakes are high: Therac-25 (1985-87) UI & testing failures → patients got 15000 rads instead of 500, 6 deaths. One-third of medical device failures/adverse events are failures of device use, not the device (1-1 p27).", "ref": "1-1 p25"}], "apply": ["Which stage (Understand / Explore / Prototype & Test / Iterate / Build & Monitor) produced this decision – was it grounded in user data or in the designer’s own preferences?", "Was the design tested with people outside the design team and outside CS (UX students ≠ CS students ≠ normal people)?", "How many prototype → evaluate cycles happened, and what changed between them?", "Is there a Build & Monitor step after release (logs, help desk, FAQs) to catch problems like the $300M button?", "Are we building the right ‘it’, or only building it right?"], "limits": [{"text": "Course project was simplified: real-world UX has more iterations of re-design and evaluation, more changing requirements, more choice of methods, more clearly defined clients, multi-disciplinary teams.", "ref": "12-1 p5"}, {"text": "Simply asking users isn’t enough – they don’t know what they want or what is possible (Ford ‘faster horses’; Morita ‘lead the public’). Need several methods.", "ref": "12-1 p21"}, {"text": "In real practice there are never enough people, resources or time for ideal testing roles.", "ref": "4-1 p29"}], "examples": [{"text": "‘The $300 Million Button’ (probably Best Buy): forced registration at checkout. 45% of customers had multiple registrations, ~160,000 password requests/day, 75% never completed purchase. Designers simply took away the Register button → purchases +45%, +$15M first month, +$300M first year.", "ref": "1-1 p15"}, {"text": "Expedia: optional ‘Company’ field → people entered bank name then bank address → card address verification failed. Deleting the field = +$12M profit a year.", "ref": "1-1 p17"}, {"text": "F16 pilot Raj Shah strapped a cheap iPAQ aviation-map app to his lap because the ~US$44M jet’s mil-spec software had no moving map.", "ref": "2-2 p7"}, {"text": "Dan Russell (Google field studies): 90% of US internet users don’t know Ctrl/Cmd+F – designers would never guess this.", "ref": "12-1 p20"}, {"text": "Facebook ‘Year in Review’ (2014) pushed unwanted grief onto Eric Meyer – “inadvertent algorithmic cruelty”.", "ref": "1-1 p29"}], "quotes": [{"text": "User Experience is essentially a design methodology which focuses on the end user first and foremost. It places the user at the heart of every design decision.", "ref": "1-1 p12"}, {"text": "Assuming that your users are just like you can be described as a fundamental attribution error of design", "ref": "12-1 p21"}, {"text": "“We are abnormal!”", "ref": "2-2 p8"}], "related": ["requirements", "user-diversity", "ethics", "user-testing", "observations", "interviews", "paper-prototyping", "digital-prototyping", "personas"], "keySlides": ["12-1 p21", "4-2 p2", "2-2 p6"]}, {"id": "ethics", "name": "Professional Ethics in UX", "group": "awareness", "lecture": "1-2", "aliases": ["professional ethics", "ethics in UX", "ethical", "informed consent", "consent", "privacy", "anonymity", "anonymise", "confidentiality", "coercion", "voluntary participation", "right to withdraw", "deceptive design", "dark patterns", "addictive design", "data deletion", "delete data", "ACM code of ethics", "human research ethics committee", "HREC", "integrity"], "summary": "Two categories: (1) ethics of performing UX activities – participants, studies, data, truthful reporting (integrity); (2) ethics of the designed artefact – deceptive, addictive, exclusive or just bad design. Use ethics as an evaluation lens: is anyone harmed by my design choices?", "points": [{"text": "Two main categories: ethics of performing UX activities (participants, studies, data; truthful reporting = integrity) and ethics of the designed artefact (would you create a virus? is it deliberately deceptive? what happens when deployed in the real world?).", "ref": "1-2 p4"}, {"text": "Professional societies (ACM, IEEE, ENZ, AC

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COMPX324 Exam Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,800;1,400&display=swap">
<style>
/* Layout: two-pane lookup desk — index/results on the left, the open card or slide on the right; collapses to one pane under 880px. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e4e8ee; --line:#d3d9e1; --fg:#17202b; --muted:#5b6675;
  --accent:#2347c9; --accent-ink:#ffffff; --accent-soft:#e3e9fd; --mark:#ffe58f; --mark-fg:#17202b;
  --ok:#17794a; --ok-soft:#dff3e8; --bad:#b4282f; --bad-soft:#fbe3e4; --mid:#8a5a00; --mid-soft:#fbefd4;
  --font-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Atkinson Hyperlegible Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:8px; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e27; --sunk:#0b1016; --line:#2a3441; --fg:#e6ebf1; --muted:#9aa6b5;
  --accent:#8fa8ff; --accent-ink:#0b1230; --accent-soft:#1f2a4d; --mark:#6b5a12; --mark-fg:#fff6d4;
  --ok:#5fd29a; --ok-soft:#14321f; --bad:#ff8d93; --bad-soft:#3a1719; --mid:#f2c162; --mid-soft:#3a2c0e; color-scheme:dark;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e27; --sunk:#0b1016; --line:#2a3441; --fg:#e6ebf1; --muted:#9aa6b5;
  --accent:#8fa8ff; --accent-ink:#0b1230; --accent-soft:#1f2a4d; --mark:#6b5a12; --mark-fg:#fff6d4;
  --ok:#5fd29a; --ok-soft:#14321f; --bad:#ff8d93; --bad-soft:#3a1719; --mid:#f2c162; --mid-soft:#3a2c0e; color-scheme:dark;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
mark{background:var(--mark);color:var(--mark-fg);border-radius:2px;padding:0 1px}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.2}
.mono{font-family:var(--font-mono)}
.app{display:flex;flex-direction:column;height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-weight:800;letter-spacing:-.01em;font-size:16px}
.brand span{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:9px;overflow-x:auto;max-width:100%}
.tab{border:0;background:transparent;padding:6px 11px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tab kbd{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-left:5px;opacity:.8}
.spacer{flex:1}
.clock{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;background:var(--surface);white-space:nowrap}
.clock .t{font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.clock .q{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.clock.warn{border-color:var(--mid);background:var(--mid-soft)}
.clock.late{border-color:var(--bad);background:var(--bad-soft)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;font-size:13px;line-height:1}

/* panes */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(320px,400px) 1fr}
.pane{min-width:0;min-height:0;overflow:auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.left{border-right:1px solid var(--line);background:var(--bg)}
.right{background:var(--bg)}
.single{grid-template-columns:1fr}
.single .pane{max-width:1100px;width:100%;margin:0 auto}
@media (max-width:880px){
  .main{grid-template-columns:1fr}
  .main.has-detail .left{display:none}
  .main:not(.has-detail) .right{display:none}
  .backbtn{display:inline-flex!important}
}
.navback{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;max-width:min(44vw,320px);overflow:hidden;text-overflow:ellipsis}
.navback:hover{background:var(--accent);color:var(--accent-ink)}
.backbtn{display:none;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;margin-bottom:10px;font-weight:600}

/* search */
.searchwrap{position:relative;margin-bottom:12px}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 44px 11px 14px;font-size:16px}
.search:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.searchwrap kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted);background:var(--sunk)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sec{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;display:flex;justify-content:space-between;gap:8px}
.sec:first-child{margin-top:0}
.list{display:flex;flex-direction:column;gap:4px}
.item{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:var(--r);padding:8px 10px;cursor:pointer}
.item:hover{background:var(--surface);border-color:var(--line)}
.item.active{background:var(--surface);border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.item .row{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.item .nm{font-weight:600}
.item .sn{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ref{font-family:var(--font-mono);font-size:12px;color:var(--accent);background:var(--accent-soft);border:0;border-radius:5px;padding:1px 6px;white-space:nowrap;cursor:pointer;font-weight:600;vertical-align:baseline}
.ref.gen{color:var(--muted);background:var(--sunk);cursor:default}
.ref.mine{color:var(--ok);background:var(--ok-soft)}
.tag{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.stance{font-family:var(--font-mono);font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.stance.supports{color:var(--ok);background:var(--ok-soft)}
.stance.violates{color:var(--bad);background:var(--bad-soft)}
.stance.mixed{color:var(--mid);background:var(--mid-soft)}
.empty{color:var(--muted);padding:12px 4px}

/* detail card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow);max-width:920px}
.card+.card{margin-top:14px}
.dhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;margin-bottom:6px}
.dhead h2{font-size:26px;font-weight:800;letter-spacing:-.015em}
.summary{font-size:17px;line-height:1.5;margin:6px 0 4px;max-width:68ch}
.blk{margin-top:18px}
.blk h3{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.pts li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;padding-bottom:7px;border-bottom:1px dashed var(--line);max-width:80ch}
.pts li:last-child{border-bottom:0}
.checks li{grid-template-columns:auto 1fr}
.checks li::before{content:"?";font-family:var(--font-mono);font-weight:600;color:var(--accent);width:1.2em}
.quote{border-left:3px solid var(--line);padding:2px 0 2px 12px;font-style:italic;margin:6px 0}
.related{display:flex;flex-wrap:wrap;gap:6px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.thumb{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk);cursor:pointer;padding:0;text-align:left}
.thumb img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff}
.thumb span{display:block;padding:4px 8px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.ev{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;background:var(--bg)}
.ev .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ev .argue{color:var(--muted);font-size:14px}
.ev .argue::before{content:"Argue → ";font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;color:var(--accent)}
.evs{display:grid;gap:8px}
.phase-h{font-weight:800;font-size:14px;margin:6px 0 2px}
textarea.notes{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;resize:vertical}

/* viewer */
.viewer .vimg{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
.viewer canvas{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
.vtext{white-space:pre-wrap;font-size:14px;line-height:1.45;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px;overflow-x:auto;font-family:var(--font-body)}
.vnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.note{font-size:13px;color:var(--muted)}

/* builder + ask */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px;align-items:start}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-weight:600;font-size:14px}
.ta{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:84px;resize:vertical;font-size:15px}
.ta:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pick .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.addc{border:1px dashed var(--line);border-radius:999px;padding:3px 10px;background:transparent;font-size:13px;width:150px}
.part{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.part h3{font-size:19px;font-weight:800;margin-bottom:4px}
.part .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.tick{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;padding:4px 0;cursor:pointer}
.tick input{margin:0;transform:translateY(2px)}
.outline{white-space:pre-wrap;font-family:var(--font-body);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14.5px;overflow-x:auto}
.structure{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:4px 0 0}
.structure div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px}
.structure b{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.answer{font-size:15px;line-height:1.55;max-width:80ch}
.answer h1,.answer h2,.answer h3,.answer h4{font-size:16px;font-weight:800;margin:18px 0 6px}
.answer ul,.answer ol{padding-left:22px;margin:6px 0}
.answer li{margin:3px 0}
.answer p{margin:8px 0}
.answer code{font-family:var(--font-mono);font-size:13px;background:var(--sunk);padding:0 4px;border-radius:4px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
details.src{margin-top:12px;font-size:13px;color:var(--muted)}
details.src summary{cursor:pointer;font-weight:600}
.hist{display:flex;flex-direction:column;gap:4px}

/* exam plan */
table.plan{width:100%;border-collapse:collapse;font-size:14.5px}
.plan th{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600}
.plan td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.plan tr.active td{background:var(--accent-soft)}
.plan td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.plan input{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 6px;width:100%}
.plan input:hover,.plan input:focus{border-color:var(--line);background:var(--surface)}
.plan input.n{width:64px;font-family:var(--font-mono)}
.st{border:0;border-radius:999px;padding:2px 10px;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
.st.todo{background:var(--sunk);color:var(--muted)}
.st.doing{background:var(--accent-soft);color:var(--accent)}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.flag{background:var(--mid-soft);color:var(--mid)}
.bigclock{display:flex;flex-wrap:wrap;gap:20px 36px;align-items:flex-end}
.bigclock .v{font-family:var(--font-mono);font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.bigclock .k{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.bar{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden;position:relative;margin-top:16px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg)}
.scroll-x{overflow-x:auto}
.upl{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;background:var(--surface);cursor:pointer}
.upl.drag{border-color:var(--accent);background:var(--accent-soft)}
.doclist{display:grid;gap:6px;margin-top:12px}
.doc{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.doc .nm{font-weight:600;overflow-wrap:anywhere;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;z-index:20;box-shadow:var(--shadow)}
.help{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.help kbd{font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--sunk);white-space:nowrap;justify-self:start}

.vimg.portrait,.vimgwrap.portrait{max-width:780px}
.vimgwrap{width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.vimgwrap.portrait{aspect-ratio:1/1.414}
.vimgwrap .vimg{border:0;border-radius:0}
.skel{display:flex;gap:10px;align-items:center;color:var(--muted)}
.matches{border:1px solid var(--line);border-left:3px solid var(--mark);background:var(--surface);border-radius:8px;padding:8px 12px;margin-bottom:10px;display:grid;gap:4px}
.matches .mh{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mline{font-size:14px;line-height:1.45}
details.ptext-d{margin-top:12px}
details.ptext-d summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.ptext{font-size:15px;line-height:1.55;max-width:72ch;margin-top:8px}
.ptext.solo{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px 20px}
.ptext p{margin:0 0 10px}
.ptext .pt-h{font-size:19px;font-weight:800;margin:0 0 10px;letter-spacing:-.01em}
.ptext .pt-h2{font-size:12px;font-family:var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:16px 0 6px;font-weight:600}
.ptext ul{margin:0 0 10px;padding-left:20px}
.ptext li{margin:3px 0}
.ptext li::marker{color:var(--accent)}
.pt-run{display:flex;flex-direction:column;gap:2px;margin:0 0 10px;padding-left:10px;border-left:2px solid var(--line)}
.pt-links{display:flex;flex-direction:column;gap:2px;margin-top:10px;font-size:12px;color:var(--muted);overflow-wrap:anywhere;font-family:var(--font-mono)}
[hidden]{display:none!important}
</style>

</head><body><div class="app" id="app">
  <header class="top">
    <div class="brand"><b>324 Exam Companion</b><span id="modeTag"></span></div>
    <button class="navback" id="navBack" hidden>← Back to <span></span></button>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="spacer"></div>
    <div class="clock" id="clock" title="2-hour exam countdown. Press ▶ when the exam starts."><span class="q" id="clockQ">exam</span><span class="t" id="clockT">2:00:00</span>
      <button class="iconbtn" id="clockBtn" aria-label="Start timer">▶</button><button class="iconbtn" id="clockReset" aria-label="Reset timer" title="Reset to 2:00:00" hidden>↺</button></div>
  </header>
  <div class="main" id="main"></div>

<script id="data" type="application/json">{"mode": "public", "lectureTitles": {"1-1": "Introduction", "1-2": "Professional Ethics in UX", "2-1": "Understanding Users: Observations", "2-2": "Understanding Users: Interviews", "3-1": "Understanding Users: Diary Studies", "3-2": "I/O: Humans & Computers", "4-1": "Sketching & Prototyping", "4-2": "Heuristics for UX", "5-1": "Scenarios", "5-2": "Personas", "6-1": "Fitts' Law", "6-2": "Frequency, Recency & Redundancy", "7-1": "AI & UX Design", "7-2": "Ambient & Tangible Interfaces", "8-1": "Digital Prototyping & Phase III", "9-1": "Norman's Models, Using Space, Voice", "9-2": "Preventing Errors", "10-1": "Information Visualisation", "10-2": "Hick's Law & Data-Ink Ratio", "11-1": "Accessibility", "11-2": "Internationalisation", "12-1": "Summary & Exam Preparation", "INT-Q": "Designer interview questions"}, "concepts": [{"id": "fitts", "name": "Fitts' Law", "group": "principle", "lecture": "6-1", "aliases": ["fitts", "fitt's law", "fitts law", "fits law", "target size", "pointing time", "movement time", "infinite edge", "magic pixels", "prime pixel", "pie menu", "radial menu", "touch target size"], "summary": "Prediction model for rapid, aimed movement: time to acquire a target = f(distance to target, size of target). Make it closer and/or bigger to make it faster to hit (your finger is a pointing device too).", "points": [{"text": "Time = a + b log2(2D / W); Index of Difficulty ID = log2(2D / W). a, b = empirically derived constants. The '2' was an arbitrary adjustment by Fitts to keep ID > 0. Informally: bigger targets → less time; closer targets → less time.", "ref": "6-1 p5"}, {"text": "W is measured along the axis of movement (original experiments 1-D; adjust for rotation/irregular shapes). Slide asks 'What about errors?' — MacKenzie's alternative: ID_e = log2(D/W_e + 1), W_e = 4.133 × SD_x (effective width), so throughput (bits/s) captures speed AND accuracy. Movement time is linear in ID (mouse vs RemotePoint plot).", "ref": "6-1 p6"}, {"text": "Logarithmic → curved relationship: a small size increase helps a SMALL target a lot, but barely helps a big one; same for distance (shortening a long trip matters most).", "ref": "6-1 p9"}, {"text": "Tog's quiz — 5 fastest pixels for a user near screen centre: (1) the pixel under the cursor = 'Prime Pixel' (no need to move); (2–5) the four screen corners (can't overshoot an edge; a corner has 2 edges). Right-handed mouse order: BR, TL, TR, BL.", "ref": "6-1 p4"}, {"text": "'Rule of the Infinite Edge': screen edges have effectively infinite depth — Mac 'mile high menus' on top edge; Win 95 bug left an extra pixel between taskbar and edge (fixed in XP); Windows Aero Peek (bottom-right corner) and Snap (screen sides). Doesn't apply to websites (inside a browser window).", "ref": "6-1 p23"}, {"text": "Closer: context menus appear at the cursor ('can't get any closer'); MS Smart Tags next to the target text; edit-in-place/inline editing; group actions to match expected interaction sequences.", "ref": "6-1 p11"}, {"text": "Bigger: Paste made bigger and moved top-left (Word 2003 → 2007) because frequency data showed heavy use; adding a text label to the icon enlarges the target (and adds redundancy) — make both text and icon clickable; ZX Spectrum space key → space bar.", "ref": "6-1 p13"}, {"text": "Pie/radial menus: used as context menus → short distances; wedges = larger targets than normal pop-ups; ~equal access time for all items. Downsides: awkward long labels, unfamiliarity, cover more screen. Corners are fast but only 4, static and atomic (no sub-corners).", "ref": "6-1 p25"}, {"text": "Touch is different: 'for touch we really never have any idea where the hand is'; people tap/look at the centre — centre targets can be ~7 mm, corners need ~12 mm; key items in the centre, not edges; fingers obscure small targets and their feedback.", "ref": "6-1 p33"}], "apply": ["Are the most frequent/important controls the biggest targets and closest to where the pointer/thumb already is?", "Desktop: could actions use the cursor position (context menu, inline actions) or infinite edges/corners? Touch: are key actions in the centre, ≥7 mm (≥12 mm near edges/corners)?", "Does the hit area match the visible target (whole label + icon clickable), and are targets clearly distinguishable from non-targets and spaced apart from each other?", "Are actions used in sequence placed next to each other (e.g. edit-in-place, Next beside the field just filled)?", "Are any critical controls tiny (like PowerPoint's Start Slideshow button) — worse under stress or for older users/children?", "Does optimising for distance/size break meaningful grouping of functions?"], "limits": [{"text": "Simple model assumes each movement target is isolated, independent and identical: ignores that one selection alters the context for the next, and that targets are grouped into meaningful categories — 'clearly unrealistic'.", "ref": "6-1 p30"}, {"text": "Arranging strictly by the formula can conflict with grouping/separating classes of functionality; pie menus were faster but not favoured in subjective preference.", "ref": "6-1 p29"}, {"text": "Mouse-derived assumptions don't transfer to touch: no known start point, edges/corners are LEAST accurate on phones (opposite of the mouse infinite-edge advantage).", "ref": "6-1 p31"}, {"text": "Infinite edges don't apply to web pages inside a browser window.", "ref": "6-1 p24"}, {"text": "Speed isn't everything: target context matters — moving users, older users, children, finger vs mouse.", "ref": "6-1 p19"}], "examples": [{"text": "Word 2007 ribbon: big Paste button top-left, icon + 'Paste' label", "ref": "6-1 p13"}, {"text": "PowerPoint Start Slideshow button: tiny, needs precise targeting, worse when stressed (F5 / Shift+F5 alternatives)", "ref": "6-1 p16"}, {"text": "Print dialog drop-down: is the target the whole field or just the tiny arrow?", "ref": "6-1 p17"}, {"text": "Web pagination: large clickable areas, spaced-out page links; bigger link target areas", "ref": "6-1 p21"}, {"text": "Pie menus in games: The Sims, Animal Crossing, Crysis, Mass Effect, CS:GO", "ref": "6-1 p27"}], "quotes": [{"text": "put the controls closer, or make them bigger.", "ref": "6-1 p10"}, {"text": "Key clickable items should not be along the edges, but in the center of the screen", "ref": "6-1 p34"}, {"text": "Also, consider whether can you use infinite edges or the current cursor location?", "ref": "6-1 p35"}], "related": ["hicks", "frequency", "redundancy", "space", "human-capabilities"], "keySlides": ["6-1 p5", "6-1 p25", "6-1 p33"]}, {"id": "hicks", "name": "Hick's Law", "group": "principle", "lecture": "10-2", "aliases": ["hick", "hicks law", "hick's law", "hick-hyman", "hick hyman law", "number of choices", "choice overload", "decision time", "paradox of choice", "feature fatigue", "clutter"], "summary": "The time it takes to make a decision increases as the number of alternatives increases: T = b log2(n + 1). Design implication: adding more things to your interface makes it slower to use.", "points": [{"text": "Hick's (Hick-Hyman) Law: T = b log2(n + 1); T = time to choose, n = number of equally-likely choices, b = empirically-derived constant (like Fitts).", "ref": "10-2 p2"}, {"text": "Why logarithmic: people divide choices into sub-categories and eliminate about half each step, rather than considering each one-by-one (linear time).", "ref": "10-2 p2"}, {"text": "Task = identify goal → assess available options → decide on option → implement. Hick's Law applies to steps 2 and 3.", "ref": "10-2 p3"}, {"text": "Complexity: choices usually not equally likely (different space/text/emphasis); organised choices (e.g. alphabetical) allow more efficient search; sequential effects (earlier choices affect later); training/experience speeds decisions.", "ref": "10-2 p4"}, {"text": "Categories simplify choice: users naturally break content into categories and discard whole categories → provide MEANINGFUL categories. Menus, sub-menus, hierarchies, 'Advanced', about:config reduce Hick's effects.", "ref": "10-2 p5"}, {"text": "Reduce choices: 'feature fatigue' (Thompson et al. 2005) — too many features cause dissatisfaction, anxiety; businesses simplify to a few plans (Dashlane, ProtonMail tiers). CS students as 'power users' are not typical consumers.", "ref": "10-2 p6"}, {"text": "Design response: for each element, can you give a reason why it is there? If not, delete it. Is it important enough for this UI, or could it live elsewhere (an 'Advanced' area keeps the regular UI simple)? Also the 80:20 rule.", "ref": "10-2 p12"}, {"text": "Clutter: users respond by ignoring parts of the UI (banner blindness heatmaps); overlinking every word would make Wikipedia painful; Paradox of Choice (Schwartz) — find the 'sweet spot'.", "ref": "10-2 p13"}, {"text": "First-click study (Bailey & Wolfson): correct first click → 87% task success v 46% if wrong; competing content (Hick's & data-ink) has a large effect on success.", "ref": "10-2 p27"}], "apply": ["How many options compete at each decision point? Which can be removed, grouped, or moved to an 'Advanced'/secondary area?", "Are categories meaningful to the target users (would they know which group to open)?", "Is the likely choice emphasised (default, first, larger) since choices aren't equally likely — link to frequency?", "Is the primary call-to-action clear enough that the first click is likely correct?", "Are long option lists ordered (alphabetical, by frequency) to support efficient search?"], "limits": [{"text": "Doesn't directly apply when there is lots of reading — only for relatively simple choices.", "ref": "10-2 p16"}, {"text": "Based on simple stimulus–reaction lab tasks (later menus), not complex decision-making; assumes equally likely choices; ignores sequential effects and learning.", "ref": "10-2 p4"}, {"text": "Power users may want lots of options/control — trade-off with simplicity for typical users.", "ref": "10-2 p6"}, {"text": "Hiding options in deeper hierarchies adds steps/navigation (and Fitts travel); balance breadth v depth.", "ref": "general"}], "examples": [{"text": "News site with meaningful categories (World, Business, Health…)", "ref": "10-2 p5"}, {"text": "Subscription pages offering only 3–4 plans (Dashlane, ProtonMail)", "ref": "10-2 p7"}, {"text": "Road sign clusters — visual clutter reduces effectiveness", "ref": "10-2 p9"}, {"text": "Bulk Rename Utility: every option on one screen", "ref": "10-2 p10"}, {"text": "Wikipedia overlinking guidance", "ref": "10-2 p14"}], "quotes": [{"text": "Adding more things to your interface makes it slower to use", "ref": "10-2 p8"}, {"text": "Every extra component of your UI competes for users’ attention", "ref": "10-2 p29"}, {"text": "Hick's Law doesn't directly apply when there is lots of reading: only for relatively simple choices", "ref": "10-2 p16"}], "related": ["fitts", "data-ink", "frequency", "nielsen-heuristics", "space"], "keySlides": ["10-2 p9", "10-2 p5", "10-2 p13"]}, {"id": "data-ink", "name": "Data-Ink Ratio", "group": "principle", "lecture": "10-2", "aliases": ["data ink", "data-ink", "data ink ratio", "tufte", "chartjunk", "chart junk", "non-data ink", "content-pixel ratio", "minimalism", "visual noise", "clutter"], "summary": "Tufte: what proportion of the ink on the page (or pixels on the screen) is at work communicating information? Maximise data-ink; erase non-data-ink and redundant data-ink — for graphics and interfaces ('content-pixel ratio').", "points": [{"text": "Data-ink ratio asks what proportion of ink/pixels is at work communicating information. Example: bar chart with tinted background and heavy grid → plain bars with white lines through them.", "ref": "10-2 p18"}, {"text": "Data-ink = essential non-erasable ink used to present the data; non-data-ink = redundant ink used to elaborate or decorate. Ratio = data-ink / (data-ink + non-data-ink). 'No-one ever actually calculates this ratio.'", "ref": "10-2 p19"}, {"text": "Tufte's five laws (1983): above all else show the data; maximise the data-ink ratio; erase non-data-ink; erase redundant data-ink; revise and edit. Interface version: show the content; maximise the content-pixel ratio; erase non-content and redundant content pixels; revise and edit.", "ref": "10-2 p20"}, {"text": "Remove: colours that don't support hierarchy through contrast; typefaces that draw attention for no reason; gratuitous imagery (stock photos); alignment/size/colour that draws unwanted attention (indented paragraphs, large social icons, bright off-style ads).", "ref": "10-2 p21"}, {"text": "Tactics: start with black and white, add colour only for a specific purpose; use proximity instead of arrows/lines; direct labelling instead of axis scale or key; understandable units (1.2 km v 1200 m); avoid false precision (50 v 50.00).", "ref": "10-2 p22"}, {"text": "Examine: per-row 'Add to cart' buttons → checkboxes + one button; animation to draw attention → high contrast and size; 'Are you sure?' for simple tasks (keep it only for catastrophic actions like deleting an account).", "ref": "10-2 p23"}, {"text": "Design response: for each element — should it be there, can it be simplified? For each pixel — can it be deleted/simplified (remove colour?). Tate: 80-20 rule, hide complexity, minimise visual noise, reuse components. Apply to your own documents too (table without full grid).", "ref": "10-2 p24"}, {"text": "Competing content matters: correct first click → 87% success v 46% (Hick's & data-ink).", "ref": "10-2 p27"}, {"text": "Accessibility link: start with B&W/strong contrast (people print greyscale) — do you even need colour?", "ref": "11-1 p7"}], "apply": ["For each element/pixel: what is it for? If no reason, delete or simplify.", "Charts: remove backgrounds, heavy gridlines, 3-D, legends that could be direct labels; sensible units and precision?", "Is colour used only for a purpose — does the screen still work in greyscale?", "Are repeated controls (per-row buttons, duplicate indicators) consolidated?", "Is decoration deliberate (engagement, brand, credibility) or noise competing with the primary action?"], "limits": [{"text": "Chartjunk or engaging graphics? Embellishment can aid memorisation, emotional engagement, credibility, non-linguistic rhetoric, and 'only marginally decreases understandability' — but participants were digital communication professionals (generalisable?).", "ref": "10-2 p28"}, {"text": "Heuristic, not a metric: no-one actually calculates the ratio.", "ref": "10-2 p19"}, {"text": "'Erase redundant data-ink' conflicts with good redundancy for accessibility (colour + label).", "ref": "11-1 p6"}, {"text": "Over-stripping can remove cues: targets must stay clearly distinguishable from non-targets.", "ref": "6-1 p18"}, {"text": "Confirmation dialogs are 'non-data' but still appropriate for catastrophic actions (error prevention).", "ref": "10-2 p23"}], "examples": [{"text": "Bar chart before/after: tinted grid background removed", "ref": "10-2 p18"}, {"text": "Citation table: full grid lines v minimal rules", "ref": "10-2 p26"}, {"text": "Add-to-cart per row v checkboxes + one button", "ref": "10-2 p23"}, {"text": "Embellished wine-glass Beaujolais importers chart (chartjunk debate)", "ref": "10-2 p28"}, {"text": "Nielsen 'Aesthetic and minimalist design': every extra unit of information competes with relevant ones", "ref": "4-2 p32"}], "quotes": [{"text": "Above all else show the data", "ref": "10-2 p20"}, {"text": "Perfection is achieved not when there is nothing more to add, but when there is nothing left to take away", "ref": "10-2 p22"}, {"text": "Every pixel of every component of your UI competes for users’ attention", "ref": "10-2 p29"}], "related": ["hicks", "redundancy", "infovis", "accessibility", "nielsen-heuristics"], "keySlides": ["10-2 p18", "10-2 p20", "10-2 p26"]}, {"id": "frequency", "name": "Frequency", "group": "principle", "lecture": "6-2", "aliases": ["frequency of use", "frequently used", "most used", "80-20 rule", "80/20", "pareto", "pareto principle", "logging", "telemetry", "frecency", "smart menus", "adaptive menus", "personalised menus", "red routes", "frequent users"], "summary": "How often a given user uses a particular feature (key presses, clicks, commands, documents…). Identify frequent-use scenarios and focus on getting them right: small changes to frequent tasks give big usability gains.", "points": [{"text": "Measure, for a given user + interface: key presses, mouse clicks, scrollwheel, actions taken, commands given, documents accessed — and also what features the user actually WANTS to use.", "ref": "6-2 p2"}, {"text": "First ask WHY it's used: does the user even need to do it? Can it be automated? (spell checking, word counting, Smart Tags, CD/DVD autoplay, URL autocomplete).", "ref": "6-2 p3"}, {"text": "Concentrate design attention on frequently-used elements: quicker access, less searching, better efficiency. 'Pick the low hanging fruit first' — address the easy frequent stuff first.", "ref": "6-2 p5"}, {"text": "80-20 rule (Pareto): ~80% of usage involves ~20% of features (not exactly 80/20). Also bugs: Ballmer — 20% of bugs cause 80% of errors; 1% cause half.", "ref": "6-2 p6"}, {"text": "Design responses: automate it; make it bigger; make it easier to find (remove visual competition); make it closer (Smart Tags); add another access mechanism (keyboard shortcut, dedicated hardware). Material Design FAB = 'the most common or important action on a screen' (Wise app).", "ref": "6-2 p8"}, {"text": "Acquiring data: logging/automated recording is most accurate — MS 'Help make Office Better' (1.3 billion sessions); Firefox telemetry (add-on usage). Word 2003 top 5 commands: Paste (11%; also #1 in Excel 15%, PowerPoint 12%), Save, Copy, Undo, Bold = 32% of all commands; top actions (cursor keys, Backspace) ~8× more than Paste.", "ref": "6-2 p10"}, {"text": "Occasional vs frequent users have different needs: occasional — 'I don't remember my password', 'how do I get to checkout?'; frequent — 'I wish my last order was saved', 'why confirm the same thing on three screens?'. Frequency & expertise → user customisation (styles, macros, Excel VBA).", "ref": "6-2 p4"}, {"text": "Travis matrices: frequency × importance → red routes (high/high), hygiene tasks, hidden tasks, one-off tasks; frequency × difficulty → high+easy PROMOTE, high+hard RE-DESIGN, low+hard AUTOMATE, low+easy KEEP.", "ref": "6-2 p18"}, {"text": "Frequency as basis for adaptation: 'Smart'/Personalised menus show only frequently-used items initially (Office 2000/XP Tools menu). Cache algorithms and Firefox 'frecency' combine frequency with recency.", "ref": "6-2 p28"}], "apply": ["What are the top 3–5 tasks for the target persona (from logging, observation, diary data) — are they ≤1 tap from the home screen and the most prominent elements?", "Is the most frequent action the biggest/closest target (Fitts) with no visual competition (Hick's/data-ink)?", "Could a frequent task be automated or removed entirely (auto-categorise, remember last input)?", "Do frequent users get accelerators (shortcuts, saved last entry, no repeated confirmations) without making occasional users' paths harder?", "Place each task on Travis's frequency × difficulty grid: which should be promoted, re-designed, automated, kept?", "If the UI adapts to frequency, does it keep item positions stable or give the user control (pin/customise/turn off)?"], "limits": [{"text": "Changing the interface may change the way the user works — so some other feature may become the most used. Frequency data must be re-collected after redesign.", "ref": "6-2 p9"}, {"text": "Adaptation v consistency: frequency-adaptive 'smart' menus hide less-used items, so users can't find them where they were — 'items you use less often disappear from the list, guaranteeing confusion'.", "ref": "6-2 p29"}, {"text": "Moving/hiding items breaks learned positions (spatial memory) and Nielsen's consistency heuristic; adaptive (system-controlled) vs adaptable (user-controlled customisation) is the usual fix.", "ref": "general"}, {"text": "Expert/beta users (and CS students) are unrepresentative: only logging showed the toolbar Paste button was still the most clicked despite Ctrl+V.", "ref": "6-2 p13"}, {"text": "Frequency dominates in capture slips: a frequent action sequence 'captures' a less frequent one with the same start (drive home→Y instead of X).", "ref": "9-2 p18"}], "examples": [{"text": "Office 2007: Paste promoted to the first big button on the left of Word's first tab after usage data", "ref": "6-2 p13"}, {"text": "Word 2003 top commands: Paste, Save, Copy, Undo, Bold (32% of commands)", "ref": "6-2 p11"}, {"text": "Office 2000 'Smart' Tools menu showing only frequently used items vs full normal menu", "ref": "6-2 p28"}, {"text": "Floating action button for the primary action (Material Design; Wise Android app)", "ref": "6-2 p17"}, {"text": "Voice UIs: keep lists to 3–4 items, ordered by frequency of use", "ref": "9-1 p48"}], "quotes": [{"text": "If you don’t get the frequent stuff right, then the design is likely to fail", "ref": "6-2 p5"}, {"text": "The data kept us from making a crucial, stupid mistake.", "ref": "6-2 p13"}, {"text": "Small changes to frequently used items/tasks can make big improvements in overall usability", "ref": "6-2 p5"}], "related": ["recency", "redundancy", "fitts", "hicks", "nielsen-heuristics", "error-types"], "keySlides": ["6-2 p18", "6-2 p28", "6-2 p4"]}, {"id": "recency", "name": "Recency", "group": "principle", "lecture": "6-2", "aliases": ["recently used", "recent files", "recent documents", "recent items", "history", "MRU", "LRU", "frecency", "pick up where you left off", "recently used list", "personalised menus", "smart menus"], "summary": "'What have I done recently?' is a strong predictor of the actions, documents/objects and applications a user will use next: Pr(next object ∈ recently used) > Pr(random object). Use it to reduce memory load (recognition v recall).", "points": [{"text": "Recency strongly predicts actions users will take, documents/objects they will use, applications they will use: Pr(next used object ∈ {recently used objects}) > Pr(randomly chosen object).", "ref": "6-2 p19"}, {"text": "Common across many situations: apps — recent files, recent URLs/objects; phones — record of recent numbers/contacts.", "ref": "6-2 p20"}, {"text": "Two sets of recency info at OS level: recent Applications and recent Documents (Windows XP Start menu). Also within documents: PowerPoint 'Welcome back! Pick up where you left off: Slide 22'.", "ref": "6-2 p21"}, {"text": "Office 2007 recent documents window = Recency + Centre Stage: more recent documents shown, more space devoted to them. (Centre Stage: put the most important part of the UI into the largest subsection.)", "ref": "6-2 p22"}, {"text": "HyperCard recency history: thumbnails of the last 42 cards visited.", "ref": "6-2 p23"}, {"text": "Like caches in CS (CPU, page, disk buffer, web proxy; LRU, MRU, LFU) — 'recency structures in UIs are like caches for the user's brain'. Cache algorithms often combine recency and frequency.", "ref": "6-2 p25"}, {"text": "Frecency: Firefox 3 'awesome bar' ranks URLs by f(recency, frequency, prefix_if_present). Also listed as an IUI adaptation (URL autocomplete).", "ref": "6-2 p26"}, {"text": "Basis for adaptation: Windows 2000 Personalised Menus move recently used items to the top and hide items not used recently → 'Adaptation v consistency – who wins? Another design trade-off'.", "ref": "6-2 p27"}, {"text": "Smartphone contacts study (Stefanis et al. 2014): combining frequency AND recency predicts better than either alone; UI could also remind users of contacts that used to be important but haven't been contacted lately, and suggest the mode of contact.", "ref": "6-2 p30"}], "apply": ["Does the app remember the user's last state/inputs (pick up where you left off, last-used values, recent searches/payees)?", "Is there a recent-items list in a prominent place (centre stage, ≤1 tap) so users recognise rather than recall?", "Does it combine recency with frequency (frecency) or allow pinning, so one-off items don't push out regular ones?", "If recent items reorder or menus adapt, do stable positions survive (or can the user pin/turn adaptation off)?", "Is it clear what history is recorded, and can the user clear it (privacy, shared devices)?", "Nielsen 'Flexibility & efficiency': does it offer 'items you recently looked at' / saved queries as accelerators?"], "limits": [{"text": "Adaptation v consistency: reordering/hiding by recency moves items, breaking users' learned positions.", "ref": "6-2 p27"}, {"text": "Recency alone is a weaker predictor than recency + frequency combined; recent ≠ important (important-but-dormant items get dropped).", "ref": "6-2 p30"}, {"text": "Implicit data sources: recording activity — does the UI make clear to the user what is being recorded?", "ref": "7-1 p16"}, {"text": "Recent lists take screen space and add choices (Hick's) — keep them short and relevant.", "ref": "general"}], "examples": [{"text": "Windows XP Start menu 'My Recent Documents' + recent applications", "ref": "6-2 p21"}, {"text": "PowerPoint 'Welcome back! Pick up where you left off: Slide 22'", "ref": "6-2 p21"}, {"text": "Office 2007 / 365 recent documents list given centre stage", "ref": "6-2 p22"}, {"text": "Firefox 3 awesome bar (frecency)", "ref": "6-2 p26"}, {"text": "Phone call log of recent numbers/contacts", "ref": "6-2 p20"}], "quotes": [{"text": "Recency structures in UIs are like caches for the user’s brain", "ref": "6-2 p25"}, {"text": "Adaptation v consistency – who wins?", "ref": "6-2 p27"}, {"text": "Can you use it to reduce memory load? (Recognition v recall)", "ref": "6-2 p41"}], "related": ["frequency", "redundancy", "space", "nielsen-heuristics", "ai-iui", "hicks"], "keySlides": ["6-2 p21", "6-2 p22", "6-2 p26"]}, {"id": "redundancy", "name": "Redundancy", "group": "principle", "lecture": "6-2", "aliases": ["redundant", "diverse redundancy", "duplicate", "duplication", "two channels", "dual coding", "multiple encodings", "colour and position", "icon and text", "redundant information"], "summary": "Saying the same thing twice / encoding the same information in 2 ways. Bad when it complicates designs; good when it enables access by additional groups or in more situations.", "points": [{"text": "Definition: saying the same thing twice; encoding the same information in 2 ways. 'Sometimes good, sometimes bad…'.", "ref": "6-2 p31"}, {"text": "Nielsen 'Reduce Redundancy': UI complexity increases when a single feature/link is presented in multiple ways; users rarely understand duplicates as such and waste time repeating efforts or visiting the same page twice.", "ref": "6-2 p32"}, {"text": "Australian railway help point: extra labels ('press green button on the right…', 'red button on the left…') patch an unclear panel — 'If you have to add extra labels maybe your initial design needs improving'.", "ref": "6-2 p33"}, {"text": "Traffic lights: position + colour — 2 information-carrying attributes. Lecture asks 'Why do traffic lights need 2 information-carrying attributes?' — one channel can fail (e.g. colour blindness, glare); next slide's 'Red at the bottom?' light shows a broken position code.", "ref": "6-2 p34"}, {"text": "Ringholtz (2002): if misperception occurs in one medium, supplement with the same material in another medium at the same time; best redundancy enhances usability without confusing/distracting; in attention-critical tasks (driving) it must not compete for attention. Diverse redundancy = redundant info in different modes or places.", "ref": "6-2 p37"}, {"text": "Zappos: 'Dresses' under both Women and Clothing menus — fine because they don't visually compete (only one shown at a time) and are complementary alternative pathways.", "ref": "6-2 p38"}, {"text": "Trade-offs: redundant info adds complexity (simplicity generally better); changing 2 things at once is better at gaining attention; encoding info in only one form (colour, sound) may reduce access; balance gains/losses between user groups; note legal requirements (e.g. visually impaired users).", "ref": "6-2 p39"}, {"text": "Good redundancy: adds alternatives without increasing complexity, or where gain clearly outweighs loss — diverse redundancy; keyboard shortcuts (speed + transferability when used consistently); e-commerce cross-references for boundary-spanning objects. Icon + text label (Paste) = 2 channels to the same command.", "ref": "6-2 p40"}, {"text": "Accessibility: don't use colour as the only means of conveying information — reinforce with text/icons; say 'press the button marked ON', not 'press the red button'. 'We want redundancy (good redundancy)'.", "ref": "11-1 p6"}], "apply": ["Is any critical state encoded in only ONE channel (colour only, sound only, icon only)? Add a second (text, icon shape, position, haptic).", "Do icons have text labels, with the whole label clickable?", "Are there alternative paths (menu + shortcut + cross-link) for boundary-spanning items, without them competing on the same screen?", "Is anything shown twice on the same screen (duplicate buttons, multiple completion indicators) adding clutter? Remove or merge.", "Do explanatory labels exist only because the base design is unclear? Fix the design instead.", "Who gains (colour-blind, novices, noisy/bright contexts) vs who pays (clutter, slower scanning)?"], "limits": [{"text": "Redundant information adds complexity; generally simplicity is better.", "ref": "6-2 p39"}, {"text": "Duplicates confuse: users don't recognise them as the same and repeat effort.", "ref": "6-2 p32"}, {"text": "Conflicts with Tufte: 'Erase redundant data-ink' — but erasing a second channel can hurt accessibility.", "ref": "10-2 p20"}, {"text": "In attention-critical tasks redundant info must not compete for attention resources.", "ref": "6-2 p37"}, {"text": "Shortcut redundancy only transfers when used consistently across apps.", "ref": "6-2 p40"}], "examples": [{"text": "Traffic lights: position + colour", "ref": "6-2 p34"}, {"text": "Word Paste button: icon + 'Paste' text label (bigger target + 2 channels)", "ref": "6-1 p14"}, {"text": "Zappos 'Dresses' under Women and Clothing", "ref": "6-2 p38"}, {"text": "Australian railway help-point labels", "ref": "6-2 p33"}], "quotes": [{"text": "If you have to add extra labels maybe your initial design needs improving", "ref": "6-2 p33"}, {"text": "In its most productive form, redundancy enhances usability without being confusing or distracting.", "ref": "6-2 p37"}, {"text": "Good: when it enables access by additional groups or in more situations", "ref": "6-2 p41"}], "related": ["frequency", "recency", "accessibility", "data-ink", "hicks", "fitts", "voice"], "keySlides": ["6-2 p34", "6-2 p33"]}, {"id": "norman-gulfs", "name": "Norman's Gulfs (Execution & Evaluation)", "group": "principle", "lecture": "9-1", "aliases": ["gulf of execution", "gulf of evaluation", "norman's model", "seven stage model", "7 stages of action", "execution-evaluation loop", "action cycle", "norman gulf", "normans gulfs", "don norman"], "summary": "Norman's seven-stage interaction model (user's view of the interface) splits interaction into execution (goal → action on system) and evaluation (system state → judged against goal). UX problems are expressed as two gaps: the Gulf of Execution and the Gulf of Evaluation.", "points": [{"text": "UX terms: Domain = area of work (e.g. graphic design); Goal = what you want to achieve (e.g. solid red triangle); Task = how you do it, ultimately operations/actions (select fill tool, click triangle).", "ref": "9-1 p3"}, {"text": "Seven stages: (1) establish goal (2) formulate intention (3) specify actions at interface (4) execute action (5) perceive system state (6) interpret system state (7) evaluate system state w.r.t. goal.", "ref": "9-1 p4"}, {"text": "Norman's model concentrates on the USER's view of the interface.", "ref": "9-1 p4"}, {"text": "Execution-Evaluation loop: goal → (execution: stages 2–4) → system → (evaluation: stages 5–7) → goal.", "ref": "9-1 p8"}, {"text": "Gulf of Execution: user's formulation of actions ≠ actions allowed by the system. Gap between psychological GOALS and physical ACTIONS.", "ref": "9-1 p9"}, {"text": "Gulf of Evaluation: user's expectation of changed system state ≠ actual presentation of this state. Gap between PSYCHOLOGICAL concepts and PHYSICAL concepts.", "ref": "9-1 p9"}, {"text": "Evaluation gulf is small when system gives state info that is easy to get, easy to interpret, and matches how the person thinks of the system. Test: does the user's model match the system's presentation of its state?", "ref": "9-1 p12"}, {"text": "Bridge execution: make available actions visible/discoverable, use (perceived) affordances matching actual ones, provide the actions users expect (e.g. Undo).", "ref": "general"}, {"text": "Bridge evaluation: feedback, visibility of system status, confirmation of selected actions, show current mode/selection clearly.", "ref": "9-2 p38"}], "apply": ["Walk one task through the 7 stages: at which stage does the user stall?", "Execution: can the user find/perform the action they've formulated (is it visible, allowed, named as they'd expect)?", "Evaluation: after acting, can the user perceive and interpret the new state without guessing (feedback, status, confirmation)?", "Does the system's presentation of state match the user's mental model (even if their expectation seems 'unreasonable')?", "Map gulfs to Nielsen: execution ↔ match real world / user control & freedom; evaluation ↔ visibility of system status."], "limits": [{"text": "User's expectation doesn't have to be reasonable from the designer's point of view — gulf is defined by the user's expectations, not designer logic.", "ref": "9-1 p11"}, {"text": "Abstract model of interaction — describes where problems are, not a specific fix.", "ref": "9-1 p2"}], "examples": [{"text": "Execution: 'I want to undo that step because it is wrong but Undo is not available.'", "ref": "9-1 p10"}, {"text": "Evaluation: pasting web text into a plain Word paragraph keeps HTML formatting; must use 'Paste Special' → 'Unformatted…'.", "ref": "9-1 p11"}, {"text": "S Block doors: push or pull? Handles signal pull when the door must be pushed.", "ref": "9-1 p13"}, {"text": "Printer error: no confirmation of which printer is selected → document goes to Printer Y (evaluation gulf).", "ref": "9-2 p34"}], "quotes": [{"text": "The gulf is small when the system provides information about its state in a form that is easy to get, is easy to interpret, and matches the way the person thinks of the system", "ref": "9-1 p12"}, {"text": "User's expectation doesn't have to be reasonable from your point of view", "ref": "9-1 p11"}], "related": ["affordances", "error-types", "error-prevention", "nielsen-heuristics", "human-capabilities"], "keySlides": ["9-1 p8", "9-1 p9"]}, {"id": "affordances", "name": "Affordances (perceived affordances)", "group": "principle", "lecture": "9-1", "aliases": ["affordance", "perceived affordance", "false affordance", "hidden affordance", "perceptible affordance", "gaver", "push pull door", "norman door", "afford", "affordence", "signifier"], "summary": "An object's shape/size/appearance suggests the actions it allows (a mug handle 'affords' grasping). Design goal: match PERCEIVED affordances with ACTUAL affordances.", "points": [{"text": "Psychological term. Physical objects 'afford' actions: shape and size suggest actions (pick up, twist, throw). Mug handle affords grasping.", "ref": "9-1 p16"}, {"text": "Also cultural — buttons 'afford' pushing.", "ref": "9-1 p16"}, {"text": "Screen objects: button-like objects 'afford' mouse clicks; physical-like objects suggest use; culture of computer use — icons 'afford' clicking, even double-clicking (not like real buttons!).", "ref": "9-1 p16"}, {"text": "Debate: affordances vs perceived affordances vs conventions vs learned behaviour — 'Is it a real affordance or just something I've got used to?'", "ref": "9-1 p17"}, {"text": "Gaver (1991) 2×2 (perceptual information × actual affordance): Perceptible affordance (yes/yes), False affordance (perceived, not real), Hidden affordance (real, not perceived), Correct rejection (no/no). Top row = perceived/apparent affordances.", "ref": "9-1 p18"}, {"text": "S Block doors: user perceives a pull affordance but physical pull isn't there (= false affordance); push option is hidden (= hidden affordance).", "ref": "9-1 p18"}, {"text": "(Perceived) affordances are natural in physical design but present in digital designs too. Match perceived affordances with actual affordances.", "ref": "9-1 p19"}, {"text": "Warning: be careful when importing physical ideas/symbols into artificial environments.", "ref": "9-1 p19"}, {"text": "Heuristic: if you have to add an explanatory note to a simple mechanism – your design has failed (Pā doors with PULL signs).", "ref": "9-1 p14"}], "apply": ["For each control: does it look like what it does (button looks pressable, link looks clickable)?", "Any FALSE affordances — things that look interactive but aren't (underlined/coloured text, card-like panels)?", "Any HIDDEN affordances — features users can't tell exist (swipe gestures, long-press, hover-only menus)?", "Did you need a label/instruction to explain a simple control? → design failure per Pā doors heuristic.", "Does it rely on platform convention (learned) rather than true affordance — will all users share that convention?"], "limits": [{"text": "Many digital 'affordances' are really conventions/learned behaviour (e.g. double-click) — vary with experience and culture.", "ref": "9-1 p17"}, {"text": "Importing physical metaphors to screens can create false affordances.", "ref": "9-1 p19"}], "examples": [{"text": "S Block doors — handles signal pull, door needs push.", "ref": "9-1 p13"}, {"text": "Pā doors — PULL signs added to handles.", "ref": "9-1 p14"}, {"text": "Old University web phone book: underlined 'Computer Science' creates a perceived click affordance but is not a link.", "ref": "9-1 p19"}, {"text": "Mug handle affords grasping.", "ref": "9-1 p16"}], "quotes": [{"text": "Heuristic: if you have to add an explanatory note to a simple mechanism – your design has failed", "ref": "9-1 p14"}, {"text": "Match perceived affordances with actual affordances", "ref": "9-1 p19"}], "related": ["norman-gulfs", "forcing-functions", "nielsen-heuristics", "platform-guidelines", "tangible"], "keySlides": ["9-1 p18", "9-1 p19", "9-1 p14"]}, {"id": "space", "name": "Design Principles: Using Space", "group": "principle", "lecture": "9-1", "aliases": ["using space", "screen real estate", "centre stage", "center stage", "overlays", "inlays", "accordion", "fisheye", "fish eye view", "closable panels", "space usage", "disclosure"], "summary": "Space is a core problem in all visual interfaces: screen real estate is limited, so allocate it based on user needs (Centre Stage) and re-use it with overlays, inlays, accordions, tabs, time, or distortion (fisheye).", "points": [{"text": "Most UIs have limited space ('screen real estate'); competes with OS/other apps; hardware restrictions (mobile, display sizes, number of monitors, resolutions). Audio UIs differ: time restrictions, input constraints.", "ref": "9-1 p21"}, {"text": "What is important? Controls v content; competition for space; depends on context and user needs; full-screen modes.", "ref": "9-1 p22"}, {"text": "Centre Stage: \"Put the most important part of the UI into the largest subsection of the page or window\".", "ref": "9-1 p22"}, {"text": "Centre Stage questions: obvious content element (editors, players, browsers)? What do users spend time doing (viewing, editing, creating)? Side-by-side comparison? Let user customise the UI → sensible default is good enough.", "ref": "9-1 p23"}, {"text": "Re-using limited space: tabs & dialogs; scrolling, panning.", "ref": "9-1 p25"}, {"text": "Overlays: content temporarily covers previous content (menus); good for short, contextual tasks; should avoid hiding info needed to complete the overlay task. Detail overlays/tooltips: on hover? delay? modal? how they exit?", "ref": "9-1 p26"}, {"text": "Inlays: section expands and displaces existing content, then closes back (usually slide animation). Also accordions & closable panels.", "ref": "9-1 p28"}, {"text": "Other re-use: animation/image rotators (time instead of space), scroll-driven, collage, fisheye views (greater detail in areas of interest via focused scaling).", "ref": "9-1 p31"}, {"text": "Summary: evaluate design explicitly on space usage; allocate by user needs; every pixel matters; use existing widgets (overlays/inlays, accordions, disclosure); tabs ≈ temporary overlays; use time; distort space to promote focus.", "ref": "9-1 p35"}], "apply": ["Is the most important content (the 'centre stage') given the largest area on each screen?", "Controls vs content: are rarely used controls taking space from main content? (links to Frequency)", "Do overlays/modals hide information the user needs to complete the overlay task?", "Is secondary detail placed in inlays/accordions/disclosure rather than cluttering the main view?", "Does the layout work on the smallest target screen (mobile), and can users customise it?"], "limits": [{"text": "Overlays may cover up something important.", "ref": "9-1 p26"}, {"text": "Hiding content (tabs, accordions, time-based rotators) trades visibility for space — users may not find it.", "ref": "general"}, {"text": "Fisheye interfaces have research problems and practical challenges (Jakobsen & Hornbæk).", "ref": "9-1 p33"}, {"text": "Space matters by context: no single perfect layout — aim for a sensible default.", "ref": "9-1 p23"}], "examples": [{"text": "Android storage/memory widget: words hyphenated ('Stor-age', 'Mem-ory') to fit space.", "ref": "9-1 p24"}, {"text": "Code editor sticky scroll header + minimap (overview of whole file).", "ref": "9-1 p34"}, {"text": "Apple HIG: info/detail disclosure button vs disclosure indicator for drilling into list rows.", "ref": "9-1 p30"}, {"text": "jQuery UI accordion / closable panels.", "ref": "9-1 p29"}, {"text": "Fisheye menus: greater detail in area of interest via focused scaling.", "ref": "9-1 p32"}], "quotes": [{"text": "Put the most important part of the UI into the largest subsection of the page or window", "ref": "9-1 p22"}, {"text": "Space is a core problem in all visual interfaces", "ref": "9-1 p35"}], "related": ["frequency", "data-ink", "fitts", "platform-guidelines", "voice"], "keySlides": ["9-1 p24", "9-1 p34", "9-1 p32"]}, {"id": "voice", "name": "Voice User Interfaces", "group": "awareness", "lecture": "9-1", "aliases": ["voice ui", "vui", "voice assistant", "speech interface", "ivr", "interactive voice response", "text to speech", "speech to text", "alexa", "siri", "google assistant", "conversational ui", "audio interface"], "summary": "Voice UIs (IVR → voice assistants) are not just audible text: context/environment matter more, design centres on dialogs, and auditory memory/cognitive load force short lists and explicit 'where am I' cues.", "points": [{"text": "Text-to-speech = speech synthesis; speech-to-text = spoken words → digital text/concepts/symbols.", "ref": "9-1 p38"}, {"text": "IVR (from 1970s): phone menus, audio choices, keypad presses; v2.0 lets callers say choice — limited vocabulary, simple NLP ('Sales').", "ref": "9-1 p39"}, {"text": "Voice interaction is not just audible text: typed queries ≠ spoken queries (~70% of Google Assistant requests are natural language, not keywords).", "ref": "9-1 p40"}, {"text": "Why people use voice speakers: multitask, faster, instant answers, easier daily routine.", "ref": "9-1 p41"}, {"text": "Design: user persona + devices/contexts (car v kitchen v bar; phone v speaker v TV v car) — environment more significant; plus a SYSTEM persona for the agent (personality, accent).", "ref": "9-1 p42"}, {"text": "Scenarios → Dialog: table-read the conversation like actors (a kind of user study; take notes). Prototype with Wizard of Oz — human provides the system voice.", "ref": "9-1 p44"}, {"text": "Where am I? Visual UIs show location; audio is 'travelling in the dark' — state location ('Repair Options') or echo the question ('Today's weather is …').", "ref": "9-1 p47"}, {"text": "Limit information: users forget audio list items — max 3–4 items, ordered by frequency of use; use multimodal (visual, haptic) feedback if available.", "ref": "9-1 p48"}, {"text": "Maguire (2019) VUI heuristics: minimise short-term memory load; accommodate conversational speech; maximise efficiency; adequate system feedback; high accuracy to minimise input errors; recover from errors.", "ref": "9-1 p49"}], "apply": ["Does every voice prompt tell the user where they are and what they can say?", "Are spoken option lists ≤3–4 items, ordered by frequency?", "Has the dialog been table-read / Wizard-of-Oz tested in the real context (car, kitchen, noise)?", "Is there confirmation feedback and easy error recovery when recognition fails?", "Is the design crafted for speech rather than an auditory copy of a GUI?"], "limits": [{"text": "Audio UIs have time restrictions and input constraints compared with screens.", "ref": "9-1 p21"}, {"text": "Auditory memory and cognitive load limit how much can be presented.", "ref": "9-1 p52"}, {"text": "Recognition errors degrade usability; noise in environment interferes.", "ref": "9-1 p50"}, {"text": "Context & environment matter even more than with 'normal' interactions; methods must be adapted.", "ref": "9-1 p52"}], "examples": [{"text": "Star Trek 4: Scotty talking to a computer mouse.", "ref": "9-1 p37"}, {"text": "Phone banking/IVR menus (receptionhq).", "ref": "9-1 p39"}, {"text": "58% of voice-speaker users manage shopping lists weekly; 22% keep it in the kitchen.", "ref": "9-1 p40"}], "quotes": [{"text": "Typed textual queries are not the same as spoken queries", "ref": "9-1 p40"}, {"text": "Keep list length short: 3 or 4 items max", "ref": "9-1 p48"}], "related": ["wizard-of-oz", "scenarios", "personas", "human-capabilities", "accessibility", "frequency", "ai-iui"], "keySlides": ["9-1 p49", "9-1 p50", "9-1 p40"]}, {"id": "error-types", "name": "Types of Errors (slips, lapses, mistakes)", "group": "principle", "lecture": "9-2", "aliases": ["slips", "mistakes", "lapse", "slip vs mistake", "human error", "interface error", "mode error", "capture error", "description error", "reason", "james reason", "unsafe acts", "dirty dozen", "error taxonomy", "discrimination error"], "summary": "Errors are human, interface, or functional-code errors — mostly a combination of human + system. Reason: unintended actions (slips, lapses) vs intended actions (mistakes, violations); slip = right goal, wrong actions; mistake = wrong goal, correct actions.", "points": [{"text": "Three types: Human errors (forget attachment, click wrong button); Interface errors (inconsistent terms for same object/action; restart/reboot); Functional code errors (crash/data loss when surname exceeds reserved length). Most errors = human + system (as represented by the interface).", "ref": "9-2 p2"}, {"text": "Slips: correct goal, wrong sequence of actions (mis-ordering). Mistakes: wrong goal, correct sequence of actions to achieve it.", "ref": "9-2 p17"}, {"text": "Reason (1991) unsafe acts: UNINTENDED → Slip (attentional failures: intrusion, omission, reversal, misordering, mistiming) or Lapse (memory failures: omitting planned items, place-losing, forgetting intentions). INTENDED → Mistake (rule-based: misapply good rule / apply bad rule; knowledge-based) or Violation (routine, exceptional, sabotage).", "ref": "9-2 p16"}, {"text": "Common errors (Reason 1992): Storage failure (send email twice); Test failure (forget goal, e.g. sub-goal interference — start email, forget recipient); Subroutine failure (omit a step — forget attachment).", "ref": "9-2 p6"}, {"text": "Discrimination errors (wrong object from similar ones — Notepad vs WordPad); Programme assembly errors (combine actions wrongly — delete attachment, save email); Mode errors (action right in one mode, wrong in another — Excel Ready/Edit/Enter/Point).", "ref": "9-2 p7"}, {"text": "Capture errors (slip/lapse): two activities share a start sequence; the more frequent one takes over (drive home → Y instead of X). 'Frequency dominates'.", "ref": "9-2 p18"}, {"text": "Description errors (slip): two similar activities interfere (water on cereal, milk in glass) — similar location, time, goal.", "ref": "9-2 p19"}, {"text": "Person-centric view: errors from forgetfulness, inattention, carelessness… → fix people (posters, procedures, retraining, naming & blaming). System-centric view: humans fallible, errors expected, causes systematic → change conditions, add safeguards & defences.", "ref": "9-2 p20"}, {"text": "Human factors 'Dirty Dozen' (Dupont 1993) preconditions: communication, distraction, resources, stress, complacency, teamwork, pressure, awareness, knowledge, fatigue, assertiveness, norms → design systems resilient to human error.", "ref": "9-2 p14"}], "apply": ["Classify own error: was the goal right (slip/lapse) or wrong (mistake)? Unintended vs intended?", "Name the specific type: capture, description, mode, discrimination, subroutine/omission, storage, test failure?", "Was it partly an interface error (inconsistent terms, poor feedback, hidden mode)? Argue system-centric, not 'my fault'.", "Which preconditions (Dirty Dozen: distraction, pressure, fatigue…) contributed?", "Slips → fix with constraints/forcing functions/feedback; mistakes → fix with better conceptual model, info, suggestions."], "limits": [{"text": "A focus on 'surface errors' can distract from an underlying design problem (why must I type a number at all?).", "ref": "9-2 p4"}, {"text": "Categories overlap: capture may also be a test failure; description may also be a discrimination error.", "ref": "9-2 p18"}, {"text": "Person-centric 'blame the driver' fixes reduce variability but ignore system causes.", "ref": "9-2 p20"}], "examples": [{"text": "Torrey Canyon (1967) mode error: steering lever put in 'disengage' (between 2 most used modes) instead of 'manual'; delayed feedback, commercial pressure, stress.", "ref": "9-2 p12"}, {"text": "Mizuho Securities: sold 610,000 shares at ¥1 instead of 1 share at ¥610,000 — data entry error, ≥¥27bn loss.", "ref": "9-2 p9"}, {"text": "Lecturer's own: printing to non-default printer, later document goes there — no confirmation of selected printer.", "ref": "9-2 p34"}, {"text": "ANA jet: co-pilot hit rudder trim instead of door unlock button.", "ref": "1-1 p28"}], "quotes": [{"text": "Most errors are some combination of human + system (as represented by the Interface)", "ref": "9-2 p2"}, {"text": "we need to design systems that are resilient to human error", "ref": "9-2 p14"}], "related": ["error-prevention", "forcing-functions", "nielsen-heuristics", "norman-gulfs", "frequency", "human-capabilities"], "keySlides": ["9-2 p16", "9-2 p12"]}, {"id": "error-prevention", "name": "Strategies for Preventing Errors", "group": "principle", "lecture": "9-2", "aliases": ["preventing errors", "error prevention", "design strategies to prevent errors", "guardrails", "defensive design", "swiss cheese model", "undo", "confirmation", "checklists", "preview", "default values", "friction", "reason's principles"], "summary": "Design strategies (9-2 p38): defensive design (guardrails, preview, checklists), feedback (confirmation, progress reminders/wizards), visibility of system status, forcing functions, intelligence in the interface, Swiss Cheese Model layers, and recoverability (undo/redo).", "points": [{"text": "MASTER LIST: Defensive design (guardrails, preview, checklists); Feedback (confirmation of selected actions; reminders of progress — wizard-style constrained sequences); Visibility of system status; Forcing functions; Intelligence in the interface (e.g. attachments); 'Swiss Cheese Model'; Recoverability: undo, redo.", "ref": "9-2 p38"}, {"text": "Guardrails: constraints that prevent error conditions — data fields that don't allow error-causing characters; length restriction → content restriction (NZ postcode = 4 numbers).", "ref": "9-2 p22"}, {"text": "Offer suggestions: for unusual input/situations — hints users can accept or ignore.", "ref": "9-2 p24"}, {"text": "Preview and review: show a preview of an action (Print Preview); allow review before execution, especially significant actions.", "ref": "9-2 p25"}, {"text": "Good default values: pre-populate with sensible defaults set from context (journey planner: return after departure). Also support undo and redo.", "ref": "9-2 p26"}, {"text": "Checklists: Gawande's 2-minute surgical checklist (adapted from pilots) → 'massively better results'.", "ref": "9-2 p27"}, {"text": "Constrain input type: different date entry UIs (text, segmented, menus, pickers) produce different error patterns.", "ref": "9-2 p3"}, {"text": "Design is about trade-offs: consequences of error vs cost to speed/ease; some tasks should be difficult (Titan II two-key launch). Deliberate friction: BNZ pause alerts, switched button placements to break autopilot.", "ref": "9-2 p5"}, {"text": "Reason's principles: error universal & inevitable; not intrinsically bad (learning); change conditions not humans; best people make worst mistakes; errors are consequences not causes; recurrent patterns; occur at all levels.", "ref": "9-2 p37"}], "apply": ["Guardrail: could input constraints (type, length, content, picker) have made the erroneous input impossible?", "Feedback/visibility: would confirmation of the selected option or visible status/mode have exposed the error before commit?", "Preview/review: was there a review step before an expensive/irreversible action?", "Intelligence: could the system detect a likely error (e.g. 'attachment' keyword, unusual value) and suggest a fix?", "Forcing function: could an interlock/lock-in/lockout make the error physically impossible?", "Recoverability: if prevention fails, is there undo/redo? Swiss cheese: how many layers failed to line up?"], "limits": [{"text": "Trade-off: prevention adds cost to speed/ease of access; weigh against error consequences.", "ref": "9-2 p5"}, {"text": "Fixing the surface error may miss the real design problem (why require the input at all?).", "ref": "9-2 p4"}, {"text": "No single defence is perfect — hence Swiss Cheese layering; forcing functions can still be circumvented.", "ref": "9-2 p33"}, {"text": "Over-confirmation ('Are you sure?') becomes habitual and ignored.", "ref": "general"}], "examples": [{"text": "Thunderbird 3 'Found an attachment keyword' bar; Gmail 'You wrote \"see attachment\"… Send anyway?' — intelligence in the interface.", "ref": "9-2 p35"}, {"text": "UK NATS air traffic failure: absence of guardrails on data input and no data checking on import.", "ref": "9-2 p23"}, {"text": "BNZ app friction: pause alerts, switched button placements against scams.", "ref": "9-2 p15"}, {"text": "Jeff Veen: why can I type >100 if max is 100 — and why type a number at all?", "ref": "9-2 p4"}, {"text": "Nielsen #5 Error prevention: eliminate error-prone conditions or confirm before commit; mandatory fields, validation, 'Are you sure?'.", "ref": "4-2 p27"}], "quotes": [{"text": "You cannot change the human condition, but you can change the conditions in which humans work", "ref": "9-2 p37"}, {"text": "Errors are consequences not causes", "ref": "9-2 p37"}, {"text": "Even better than good error messages is a careful design which prevents a problem from occurring in the first place.", "ref": "4-2 p27"}], "related": ["forcing-functions", "error-types", "nielsen-heuristics", "norman-gulfs", "affordances", "redundancy"], "keySlides": ["9-2 p38", "9-2 p35"]}, {"id": "forcing-functions", "name": "Forcing Functions (interlocks, lock-ins, lockouts)", "group": "principle", "lecture": "9-2", "aliases": ["forcing function", "interlock", "interlocks", "lockin", "lock-in", "lockins", "lockout", "lock-out", "lockouts", "graduated lockout", "physical constraint", "poka-yoke", "mistake proofing", "greyed out"], "summary": "A forcing function is a physical constraint that prevents (strongly discourages) possible actions. Three types in lecture: interlocks (force sequence), lock-ins (keep operation active), lockouts (prevent entering danger / an event).", "points": [{"text": "Definition: a physical constraint that prevents (strongly discourages) possible actions.", "ref": "9-2 p28"}, {"text": "Physical constraint example: manhole covers round (or Reuleaux triangle) so they cannot fall through the hole.", "ref": "9-2 p29"}, {"text": "INTERLOCKS: force a specific sequence of actions — steering wheel won't turn without key in ignition; microwave won't start with door open; alcohol car-ignition interlocks.", "ref": "9-2 p30"}, {"text": "LOCK-INS: keep an operation active, preventing premature stopping — app won't quit until you save/discard unsaved doc; IE 'Are you sure you want to leave this page?'.", "ref": "9-2 p31"}, {"text": "LOCKOUTS: prevent entering a dangerous place or an event occurring — privileged machine instructions; greyed-out menu items/buttons.", "ref": "9-2 p32"}, {"text": "Graduated lockout = low-damage warning (car-park height clearance bar before the real low ceiling).", "ref": "9-2 p32"}, {"text": "ATM lockout/sequence (Norman, DOET): must remove card before cash is delivered; you could still leave the money, but less likely since money is the goal → forcing function isn't perfect.", "ref": "9-2 p33"}, {"text": "Listed among Design Strategies to Prevent Errors.", "ref": "9-2 p38"}], "apply": ["Could an interlock enforce the correct order (e.g. can't 'Send' until required attachment/field present)?", "Could a lock-in stop the user abandoning a task mid-way and losing work (unsaved-changes prompt)?", "Could a lockout disable invalid/dangerous actions in the current state (greyed-out button)?", "Is a graduated lockout (cheap early warning) better than a hard block?", "Does the goal sit AFTER the forced step (ATM: cash after card) so users can't skip it?"], "limits": [{"text": "Not perfect — can be circumvented (ATM: can still walk off without the money).", "ref": "9-2 p33"}, {"text": "Trade-off with speed/ease; only worth it where error consequences are high ('some tasks should be difficult').", "ref": "9-2 p5"}, {"text": "Absence of forcing function enables error (car battery terminals reconnected wrong way).", "ref": "9-2 p36"}, {"text": "Greyed-out items may not explain WHY they're disabled (hurts evaluation).", "ref": "general"}], "examples": [{"text": "Microwave won't start with door open (interlock).", "ref": "9-2 p30"}, {"text": "'Are you sure you want to leave this page?' (lock-in).", "ref": "9-2 p31"}, {"text": "ATM card-before-cash.", "ref": "9-2 p33"}, {"text": "Titan II: two keys turned within 2 s of each other, held 5 s.", "ref": "9-2 p5"}, {"text": "Car battery: no forcing function for + and − terminals.", "ref": "9-2 p36"}], "quotes": [{"text": "A forcing function is a physical constraint that prevents (strongly discourages) possible actions.", "ref": "9-2 p28"}, {"text": "The possibility exists so the forcing function isn't perfect.", "ref": "9-2 p33"}], "related": ["error-prevention", "error-types", "affordances", "nielsen-heuristics"], "keySlides": ["9-2 p32", "9-2 p31", "9-2 p33"]}, {"id": "observations", "name": "Observations (Ethnography)", "group": "technique", "lecture": "2-1", "aliases": ["observation", "observe", "observing users", "ethnography", "ethnography-lite", "ethnographic", "participant observation", "auto-ethnography", "autoethnography", "field study
